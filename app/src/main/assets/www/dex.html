<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fae"><title>海洋图鉴 · 捞捞小鱼3.0</title>
<style>
:root{--deep:#06435f;--sea:#087fae;--glass:rgba(5,75,106,.78);--stroke:#d9fbff88;--gold:#ffd36f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f5fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae55,#032d4bd9),url("assets/backgrounds/home-reef.png") center/cover fixed}
button,input{font:inherit}.top{position:sticky;top:0;z-index:10;background:#064b6deF;border-bottom:1px solid #d9fbff66;backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 16px 12px}.topin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid var(--stroke);border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.title{flex:1}.title b{font-size:20px}.title small{display:block;color:#c9f4fa;font-size:11px}.count{font-weight:950;color:#fff1b7}
main{max-width:1100px;margin:auto;padding:18px 16px 38px}.hero{padding:18px;border:1px solid var(--stroke);border-radius:24px;background:linear-gradient(130deg,#0a91b7cc,#06466fdb);box-shadow:0 12px 30px #00314b66,inset 0 1px 0 #fff8}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 14px;font-size:12px;color:#d6f8fb}.progress{height:10px;border-radius:99px;background:#003b5d;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff2a4,#ffc04f);border-radius:99px}.stats{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#e4fbff}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:180px;border:1px solid var(--stroke);border-radius:15px;padding:11px 14px;background:#e9fbffed;color:#16475b;outline:none}.filter{border:1px solid var(--stroke);border-radius:15px;padding:10px 13px;background:#07577a;color:#eaffff;font-weight:850}.filter.active{background:linear-gradient(#fff0a7,#ffc75a);color:#71440f;border-color:#fff2c6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{position:relative;min-width:0;overflow:hidden;text-align:left;border:1px solid #e3ffff88;border-radius:20px;padding:10px;background:linear-gradient(145deg,#eaffffef,#b8eaf0ed);color:#17495b;box-shadow:0 8px 18px #00334d55,inset 0 1px 0 #fff;cursor:pointer}.art{height:105px;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle at 50% 35%,#fff 0,#b8f0f4 48%,#64c5db 100%);overflow:hidden}.art img{width:88%;height:92%;object-fit:contain;filter:drop-shadow(0 7px 5px #185b7a55);transition:transform .2s}.card:active .art img{transform:scale(.94)}.card.lock .art img{filter:grayscale(1) brightness(.32);opacity:.62}.name{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:8px 1px 3px;font-weight:1000;font-size:14px}.id{font-size:10px;color:#5d8491}.fact{min-height:32px;margin:0 1px;color:#557886;font-size:10px;line-height:1.55}.tag{position:absolute;top:15px;right:15px;border-radius:99px;padding:4px 7px;background:#087f9c;color:white;font-size:9px;font-weight:900}.lock .tag{background:#5f8292}.empty{grid-column:1/-1;padding:25px;text-align:center;color:#e4fbff}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:#002d49b8;backdrop-filter:blur(8px)}.modal.show{display:flex}.dialog{width:min(390px,100%);padding:20px;border:2px solid #e5ffff;border-radius:25px;background:linear-gradient(155deg,#47d1dc,#0873a6 80%);box-shadow:0 20px 50px #002c46aa;text-align:center}.dialog img{width:150px;height:130px;object-fit:contain;filter:drop-shadow(0 8px 6px #003f5555)}.dialog h2{margin:4px 0}.dialog p{font-size:12px;line-height:1.7;color:#e5fbff}.dialog button{border:0;border-radius:99px;padding:11px 24px;background:linear-gradient(#fff0a7,#ffc65a);color:#71440f;font-weight:950}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.art{height:145px}.card{padding:13px}.name{font-size:15px}.fact{font-size:11px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="top"><div class="topin"><button class="back" id="back" aria-label="返回">‹</button><div class="title"><b>海洋图鉴</b><small>每一次相遇，都是海洋送来的礼物</small></div><div class="count" id="count">0 / 87</div></div></header>
<main>
<section class="hero"><h1>🐠 海洋伙伴收藏册</h1><p>探索海域、完成关卡，认识更多海洋伙伴。</p><div class="progress"><i id="bar"></i></div><div class="stats"><span id="progressText">已发现 0 种</span><span>共 87 种伙伴</span></div></section>
<div class="tools"><input class="search" id="search" placeholder="搜索鱼类名称…" aria-label="搜索鱼类"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="owned">已发现</button><button class="filter" data-filter="locked">未发现</button></div>
<section class="grid" id="grid" aria-live="polite"></section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><img id="detailArt" alt=""><h2 id="detailName"></h2><p id="detailFact"></p><button id="close">知道啦</button></div></div>
<script src="species-data.js"></script>
<script>
const KEY='llaolao.fish.v1';let filter='all',query='';
const $=s=>document.querySelector(s);
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function unlockedIds(d){const set=new Set();const dex=d.dex||{};if(Array.isArray(dex))dex.forEach(x=>set.add(Number(x)));else Object.keys(dex).forEach(k=>{if(dex[k])set.add(Number(k))});(d.aqua&&Array.isArray(d.aqua.fish)?d.aqua.fish:[]).forEach(name=>{const f=SPECIES_DATA.find(x=>x.name===name);if(f)set.add(f.id)});Object.keys(d.aqua&&d.aqua.owned||{}).forEach(k=>{if(d.aqua.owned[k])set.add(Number(k))});return set}
function render(){const d=read(),got=unlockedIds(d),n=got.size;$('#count').textContent=n+' / '+SPECIES_DATA.length;$('#progressText').textContent='已发现 '+n+' 种';$('#bar').style.width=(n/SPECIES_DATA.length*100)+'%';const rows=SPECIES_DATA.filter(f=>(filter==='all'||(filter==='owned'?got.has(f.id):!got.has(f.id)))&&(!query||f.name.includes(query)));$('#grid').innerHTML=rows.length?rows.map(f=>{const has=got.has(f.id);return `<button class="card ${has?'':'lock'}" data-id="${f.id}"><span class="tag">${has?'已发现':'未发现'}</span><div class="art"><img loading="lazy" src="assets/fish/${f.asset}.webp" alt="${has?f.name:'未知海洋生物'}"></div><div class="name"><span>${has?f.name:'神秘伙伴'}</span><span class="id">#${String(f.id+1).padStart(2,'0')}</span></div><p class="fact">${has?f.fact:'在关卡中遇见并完成挑战后解锁'}</p></button>`}).join(''):'<div class="empty">没有找到符合条件的伙伴</div>'}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(!c)return;const f=SPECIES_DATA[Number(c.dataset.id)],has=unlockedIds(read()).has(f.id);$('#detailArt').src='assets/fish/'+f.asset+'.webp';$('#detailName').textContent=has?f.name:'神秘伙伴';$('#detailFact').textContent=has?f.fact:'这位伙伴还在海洋深处等待与你相遇。继续探索并完成关卡，就有机会发现它。';$('#modal').classList.add('show')});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));
$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});$('#back').onclick=()=>location.href='index.html';window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
</script></body></html>
