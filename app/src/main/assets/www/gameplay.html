<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>捞捞小鱼 · 玩法原型 v0.3</title>
<style>
  :root{
    --cream:#FFF7EC; --sea:#A8DADC; --coral:#FFB5A7; --lemon:#FFE29A;
    --mint:#B8E0D2; --taro:#CDB4DB; --ink:#2B4A55; --ink2:#5C7C88;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{transition:background .6s ease}
  /* V2.0 六大海域（策划案 §6）：data-rank 由 rankOf 每 10 关自动切换。
     分层做法 = 顶部水域光 + 远景礁石/沉船晕 + 主色渐变；不新增图片、不遮挡操作区。 */
  body[data-rank="0"]{ /* 01—10 阳光珊瑚海：薄荷青 / 暖金 / 浅海礁石 */
    background:
      radial-gradient(110% 52% at 50% -14%, rgba(255,246,196,.92), transparent 64%),
      linear-gradient(101deg, transparent 38%, rgba(255,255,255,.28) 40%, transparent 45%),
      radial-gradient(46% 18% at 10% 94%, rgba(69,166,158,.30), transparent 72%),
      radial-gradient(42% 16% at 90% 96%, rgba(255,168,128,.30), transparent 72%),
      linear-gradient(180deg,#E4FAF3 0%,#C2ECE4 48%,#92D9DE 100%);
  }
  body[data-rank="1"]{ /* 11—20 荧光水母湾：青蓝 / 柔紫 / 发光水母 */
    background:
      radial-gradient(60% 34% at 24% 22%, rgba(183,158,246,.38), transparent 72%),
      radial-gradient(52% 30% at 78% 36%, rgba(120,222,236,.42), transparent 74%),
      radial-gradient(70% 20% at 50% 98%, rgba(86,124,206,.22), transparent 76%),
      linear-gradient(180deg,#E6F2FD 0%,#D3E4FA 46%,#BCC9F0 100%);
  }
  body[data-rank="2"]{ /* 21—30 幽灵沉船区：铜绿 / 沉木 / 旧船 */
    background:
      radial-gradient(64% 40% at 76% 16%, rgba(255,236,186,.62), transparent 72%),
      radial-gradient(48% 22% at 16% 92%, rgba(76,132,116,.34), transparent 74%),
      radial-gradient(40% 18% at 84% 96%, rgba(122,94,62,.22), transparent 72%),
      linear-gradient(180deg,#FBF4DF 0%,#F1E2BE 48%,#D8C9A4 100%);
  }
  body[data-rank="3"]{ /* 31—40 远古海底遗迹：石柱 / 古纹 / 神秘光束 */
    background:
      linear-gradient(97deg, transparent 56%, rgba(255,252,214,.34) 58%, transparent 64%),
      radial-gradient(52% 26% at 50% 12%, rgba(255,246,196,.56), transparent 72%),
      radial-gradient(44% 20% at 18% 94%, rgba(84,158,134,.28), transparent 74%),
      radial-gradient(44% 20% at 82% 96%, rgba(120,150,168,.24), transparent 74%),
      linear-gradient(180deg,#E9FAF3 0%,#CFEEE2 48%,#AFD9CE 100%);
  }
  body[data-rank="4"]{ /* 41—50 极寒深海：冷蓝 / 冰晶 / 低照度 */
    background:
      radial-gradient(58% 30% at 30% 10%, rgba(233,251,255,.90), transparent 70%),
      linear-gradient(112deg, transparent 24%, rgba(255,255,255,.30) 26%, transparent 31%),
      radial-gradient(50% 18% at 84% 96%, rgba(96,146,186,.26), transparent 74%),
      linear-gradient(180deg,#EFF8FD 0%,#D8E9F5 46%,#B9D2E8 100%);
  }
  body[data-rank="5"]{ /* 51—60 黑暗深渊：靛蓝 / 巨型阴影 / 稀疏荧光 */
    background:
      radial-gradient(52% 28% at 74% 18%, rgba(126,226,214,.24), transparent 74%),
      radial-gradient(70% 26% at 26% 96%, rgba(38,44,92,.26), transparent 76%),
      linear-gradient(180deg,#EFEDFC 0%,#DCD8F4 48%,#C6C1E9 100%);
  }
  /* 场景层次：牌阵后面一层柔光，卡片按海域换磨砂描边与高光 */
  .board-wrap{border-radius:28px}
  body[data-rank="0"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(255,255,255,.42),transparent 76%)}
  body[data-rank="1"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(214,200,255,.34),transparent 76%)}
  body[data-rank="2"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(255,244,212,.40),transparent 76%)}
  body[data-rank="3"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(226,255,238,.40),transparent 76%)}
  body[data-rank="4"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(238,251,255,.52),transparent 76%)}
  body[data-rank="5"] .board-wrap{background:radial-gradient(72% 66% at 50% 46%,rgba(226,220,255,.38),transparent 76%)}
  body[data-rank="0"] .card{border-color:rgba(255,251,232,.98)}
  body[data-rank="1"] .card{border-color:rgba(240,236,255,.98)}
  body[data-rank="2"] .card{border-color:rgba(255,246,222,.98)}
  body[data-rank="3"] .card{border-color:rgba(234,255,244,.98)}
  body[data-rank="4"] .card{border-color:rgba(235,250,255,.98)}
  body[data-rank="5"] .card{border-color:rgba(240,236,255,.98)}
  body[data-rank="1"] .card .gloss{background:radial-gradient(closest-side,rgba(214,196,255,.82),rgba(255,255,255,0))}
  body[data-rank="4"] .card .gloss{background:radial-gradient(closest-side,rgba(232,250,255,.95),rgba(255,255,255,0))}
  body[data-rank="1"] .bubbles i{background:rgba(199,180,246,.56)}
  body[data-rank="4"] .bubbles i{background:rgba(226,246,255,.78)}
  body[data-rank="5"] .bubbles i{background:rgba(158,222,226,.46)}
  /* ============ 第 60 关：深渊反转 ============ */
  body.abyss{background:radial-gradient(circle at 50% 16%, #1B2C38 0%, #0C151C 55%, #04070A 100%) !important}
  body.abyss::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 40%, transparent 40%, rgba(6,2,8,.62) 100%);
    animation:abyssPulse 5.5s ease-in-out infinite}
  @keyframes abyssPulse{0%,100%{opacity:.75}50%{opacity:1}}
  body.abyss .hud .title{color:#D8F1FA}
  body.abyss .hud .sub{color:#7FA0B0}
  body.abyss .pill{background:rgba(255,255,255,.12);color:#BFE6F2}
  body.abyss .pill.rank{background:#7E2A3A !important;color:#FFD9D2}
  body.abyss .btn.ghost{background:rgba(255,255,255,.10);color:#CBEAFA}
  body.abyss .feed{background:rgba(255,255,255,.07);color:#8FB4C4}
  body.abyss .board-wrap{filter:saturate(.55) contrast(1.06)}
  body.abyss .card{border-color:rgba(120,180,205,.22);
    box-shadow:0 0 0 1px rgba(120,220,240,.10), 0 calc(var(--d)*1.2px + 6px) calc(var(--d)*2px + 12px) rgba(0,0,0,.62)}
  body.abyss .card.dim{filter:grayscale(.35) brightness(.55) contrast(1.1)}
  body.abyss .card.dim::after{background:rgba(3,9,13,.58)}
  body.abyss .tray{background:linear-gradient(180deg,#2C4150,#182630);
    box-shadow:inset 0 3px 12px rgba(0,0,0,.66), inset 0 -1px 0 rgba(160,220,240,.14), 0 0 26px rgba(80,200,220,.14)}
  body.abyss .slot{background:rgba(255,255,255,.05);box-shadow:inset 0 2px 7px rgba(0,0,0,.75)}
  body.abyss .bg-fish i{opacity:.06;filter:blur(3px)}
  body.abyss .card .gloss{opacity:.30;background:radial-gradient(closest-side,rgba(190,235,255,.9),rgba(255,255,255,0))}
  body.abyss .card svg{filter:brightness(1.12) drop-shadow(0 0 5px rgba(110,200,230,.22))}
  body.abyss .card .qmark{color:#FF8A78;text-shadow:0 0 10px rgba(255,90,60,.55)}
  body.abyss .slot svg{filter:drop-shadow(0 0 4px rgba(110,200,230,.25))}
  body.abyss .tray .slot.full{background:#22323C}
  body.abyss .card.shiver{animation:shiver .5s linear infinite}
  @keyframes shiver{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.2px,.8px)}75%{transform:translate(1.2px,-.8px)}}
  .abyss-note{position:fixed;left:0;right:0;top:38%;z-index:47;text-align:center;pointer-events:none;opacity:0}
  .abyss-note.on{animation:abyssNote 2.6s ease-out forwards}
  @keyframes abyssNote{0%{opacity:0;transform:scale(.92) translateY(8px)}18%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0}}
  .abyss-note b{display:block;font-size:19px;letter-spacing:5px;color:#FF6F61;
    text-shadow:0 0 18px rgba(255,60,40,.55),0 2px 0 rgba(0,0,0,.5)}
  .abyss-note i{display:block;font-style:normal;font-size:11px;letter-spacing:2px;color:#8FA6B2;margin-top:6px}

  /* ============ 卡牌拟人化气泡 ============ */
  .card .bubble{position:absolute;left:50%;top:-5px;transform:translate(-50%,-100%);z-index:6;
    background:#fff;color:#2B4A55;font-size:10px;font-weight:600;line-height:1.25;letter-spacing:.2px;
    padding:4px 7px;border-radius:9px;white-space:nowrap;pointer-events:none;
    box-shadow:0 3px 10px rgba(43,74,85,.22);animation:bubblePop .26s cubic-bezier(.2,.9,.3,1.7)}
  .card .bubble::after{content:'';position:absolute;left:50%;bottom:-3px;width:7px;height:7px;
    background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
  .card .bubble.mad{background:#FFD9D2;color:#8A2E22}
  .card .bubble.mad::after{background:#FFD9D2}
  @keyframes bubblePop{0%{opacity:0;transform:translate(-50%,-72%) scale(.7)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}
  body.abyss .card .bubble{background:#1B2A34;color:#BFE6F2;box-shadow:0 0 12px rgba(255,80,60,.28)}
  body.abyss .card .bubble::after{background:#1B2A34}

  /* ============ 潜水艇舱 ============ */
  .sub-wrap{position:relative;z-index:2}
  .sub-label{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.4px;
    color:var(--ink2);padding:0 2px 3px;font-weight:600}
  .sub-label .lamp{width:6px;height:6px;border-radius:50%;background:#5FD3A8;
    box-shadow:0 0 6px #5FD3A8;animation:lamp 2.2s ease-in-out infinite}
  @keyframes lamp{0%,100%{opacity:.35}50%{opacity:1}}
  .sub-label.danger{color:#B4483A}
  .sub-label.danger .lamp{background:#FF6F61;box-shadow:0 0 8px #FF6F61}
  body.abyss .sub-label{color:#7FA0B0}
  body.abyss .sub-label .lamp{background:#FF6F61;box-shadow:0 0 8px #FF6F61}
  .tray::before{content:'';position:absolute;inset:3px;border-radius:19px;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .tray::after{content:'';position:absolute;left:12%;right:12%;top:2px;height:5px;border-radius:99px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
  .tray.danger::before{box-shadow:inset 0 0 0 1px rgba(255,110,90,.6)}

  /* ============ 纪录片字幕 / 勋章 ============ */
  .dive-log{position:relative;z-index:2;display:flex;align-items:center;gap:6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:.3px;
    color:var(--ink2);background:rgba(20,40,50,.06);border-left:2px solid rgba(43,74,85,.28);
    padding:3px 7px;border-radius:4px;min-height:19px;overflow:hidden}
  .dive-log .rec{color:#D9603F;font-weight:700;font-size:9px;letter-spacing:1px;flex:none}
  .dive-log .rec::before{content:'● '}
  body.abyss .dive-log{background:rgba(255,255,255,.05);border-left-color:#C2483A;color:#8FA6B2}
  body.abyss .dive-log .rec{color:#FF6F61}
  .medal{width:auto;height:104px;display:block;margin:2px auto 0;filter:drop-shadow(0 6px 10px rgba(43,74,85,.18))}
  .medalrow{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:4px 0 2px}

  /* ============ 深渊死亡：碎屏 + 触手 ============ */
  .abyss-fail{position:fixed;inset:0;z-index:46;pointer-events:none;display:none}
  .abyss-fail.on{display:block}
  .abyss-fail .tent{position:absolute;left:-8%;right:-8%;bottom:-6%;height:66%;
    opacity:0;transform:translateY(38%) scaleY(.6);transform-origin:50% 100%;
    filter:drop-shadow(0 -6px 22px rgba(0,0,0,.9))}
  .abyss-fail.on .tent{animation:tentRise 1.05s cubic-bezier(.16,.9,.3,1) .12s forwards}
  @keyframes tentRise{0%{opacity:0;transform:translateY(38%) scaleY(.6)}55%{opacity:1}100%{opacity:1;transform:translateY(0) scaleY(1)}}
  .abyss-fail .cracks{position:absolute;inset:0;opacity:0}
  .abyss-fail.on .cracks{animation:crackIn .5s ease-out forwards}
  @keyframes crackIn{0%{opacity:0}40%{opacity:1}100%{opacity:.92}}
  .abyss-fail .cracks path{stroke:#DCEFF8;stroke-width:0.85;fill:none;stroke-linecap:round;
    filter:drop-shadow(0 0 2px rgba(200,240,255,.9))}
  .abyss-fail .cracks path.big{stroke-width:1.6;stroke:#F2FBFF}
  .abyss-fail .blackout{position:absolute;inset:0;background:#02060A;opacity:0}
  .abyss-fail.on .blackout{animation:blackout .9s ease-in .55s forwards}
  @keyframes blackout{0%{opacity:0}100%{opacity:.94}}
  body.abyss-dead .panel{background:#0E1A21;color:#D6EDF7;box-shadow:0 24px 60px rgba(0,0,0,.8)}
  body.abyss-dead .panel h2{color:#FF8A78}
  body.abyss-dead .panel p{color:#9FBECB}
  body.abyss-dead .btn.ghost{background:rgba(255,255,255,.10);color:#D6EDF7}
  body.abyss-dead .stars{color:#FFC46B}
  body.abyss-dead .fishline svg{width:74px;height:74px;filter:drop-shadow(0 0 14px rgba(255,90,60,.35))}

  .tabs{display:flex;gap:6px;margin:10px 0 6px}
  .tab{flex:1;border:none;border-radius:10px;padding:7px;font-size:12px;background:rgba(43,74,85,.08);
       color:var(--ink2);font-weight:600;cursor:pointer}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(43,74,85,.10)}
  .board{max-height:44vh;overflow:auto;text-align:left;border-radius:12px}
  .brow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:12px}
  .brow:nth-child(odd){background:rgba(255,255,255,.55)}
  .brow.me{background:#FFE29A;font-weight:600}
  .brow .rk{width:18px;color:var(--ink2);font-weight:600}
  .brow .nm{flex:1}
  .brow .val{color:var(--ink2);font-size:11px}
  .sharebox{background:#fff;border-radius:12px;padding:10px 12px;font-size:12px;margin:8px 0;text-align:left;line-height:1.6}
  .draft{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .dbuff{border:none;border-radius:16px;padding:12px 14px;text-align:left;background:#fff;cursor:pointer;
         box-shadow:0 3px 0 rgba(43,74,85,.10);display:flex;flex-direction:column;gap:3px}
  .dbuff b{font-size:15px}
  .dbuff span{font-size:12px;color:var(--ink2)}
  .dbuff:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,74,85,.10)}
  .tank{position:relative;height:96px;border-radius:14px;overflow:hidden;margin:8px 0 10px;
        background:linear-gradient(180deg,#CBEAF5,#A8D8EA);box-shadow:inset 0 2px 8px rgba(30,60,72,.15)}
  .tank .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:rgba(43,74,85,.5)}
  .tank .swim{position:absolute;left:-60px;top:var(--top);width:44px;height:44px;
              animation:swimBy var(--d) linear infinite}
  @keyframes swimBy{0%{transform:translateX(0)}100%{transform:translateX(560px)}}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:32vh;overflow:auto;text-align:left}
  .aitem{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:12px;padding:7px 8px}
  .aitem.has{background:#EAF7F1}
  .aitem .aicon svg{width:30px;height:30px;display:block}
  .ainfo{flex:1;min-width:0}
  .ainfo b{display:block;font-size:12px}
  .ainfo span{font-size:10px;color:var(--ink2)}
  .abuy{border:none;background:#FFB5A7;color:#7A2A1E;font-size:11px;font-weight:600;border-radius:999px;padding:4px 8px;cursor:pointer}
  .abuy:disabled{background:rgba(43,74,85,.10);color:rgba(43,74,85,.4)}
  .atag{font-size:10px;color:#2E8B6E;font-weight:600}
  .dex{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;max-height:48vh;overflow:auto}
  .dcard{background:#fff;border-radius:14px;padding:8px;text-align:left;box-shadow:0 2px 0 rgba(43,74,85,.08)}
  .dcard.lock{background:rgba(255,255,255,.55);color:rgba(43,74,85,.45)}
  .dcard .dicon{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
  .dcard .dicon svg{width:30px;height:30px}
  .dcard .dfact{font-size:11px;line-height:1.5;color:var(--ink2);margin-top:4px}
  .dcard.lock .dfact{color:rgba(43,74,85,.4)}
  .row .btn{margin:2px}
  html,body{height:100%;margin:0}
  body{
    touch-action:manipulation;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#EAF6FB 0%,#DCF0F7 55%,#CFEAF2 100%);
    overflow:hidden; user-select:none;
  }
  #app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  /* 被合集以 iframe 嵌入时，父页 modebar 已处理顶部安全区，避免双重留白 */
  html.in-hub #app{padding-top:8px;padding-bottom:8px}
  .bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubbles i{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);animation:float linear infinite}
  @keyframes float{0%{transform:translateY(0) scale(1);opacity:.0}10%{opacity:.7}100%{transform:translateY(-120vh) scale(1.15);opacity:0}}

  .hud{position:relative;z-index:2;display:flex;align-items:center;gap:8px}
  .hud .title{flex:1;text-align:center;font-size:15px;font-weight:600;letter-spacing:.5px}
  .hud .sub{font-size:11px;font-weight:400;color:var(--ink2);display:flex;gap:6px;align-items:center;justify-content:center;margin-top:2px}
  .pill{font-size:11px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.85);
        border-radius:999px;padding:1px 8px;letter-spacing:.2px;transition:all .2s}
  .pill.warn{background:#FFD9A8;color:#7A4A10}
  .pill.danger{background:#FFB5A7;color:#7A2A1E;animation:breathe 1s ease-in-out infinite}
  .pill.rank{background:#9FE1CB;color:#0F5B49;font-weight:600}
  .pill.time{background:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
  .pill.time.danger{background:#FFB5A7;color:#7A2A1E;animation:breathe 1s ease-in-out infinite}
  .btn{
    border:none;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);
    background:#fff;box-shadow:0 2px 0 rgba(43,74,85,.12), 0 4px 10px rgba(43,74,85,.06);
    transition:transform .08s ease, box-shadow .08s ease; cursor:pointer;
  }
  .btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 rgba(43,74,85,.12)}
  .btn.ghost{background:rgba(255,255,255,.7)}
  .btn.pink{background:var(--coral);color:#5A2A22}
  .btn.big{padding:14px 26px;font-size:16px;border-radius:18px}

  .meters{position:relative;z-index:2;display:flex;flex-direction:column;gap:4px}
  .bossbar{display:flex;align-items:center;gap:6px;font-size:11px;color:#7A2A1E;font-weight:600}
  .bossbar .hp{flex:1;height:8px;border-radius:999px;background:rgba(43,74,85,.12);overflow:hidden}
  .bossbar .hp i{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#B06AA8,#E2705A);transition:width .25s}
  .oxybar{height:5px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
  .oxybar i{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#7FD7C4,#4FA9D8);transition:width .3s}
  .oxybar.low i{background:linear-gradient(90deg,#FFC46B,#E2705A)}
  .ink{position:fixed;inset:0;z-index:49;pointer-events:none;opacity:0;transition:opacity .35s;
       background:
        radial-gradient(circle at 22% 28%, rgba(12,26,34,.96) 0 16%, transparent 17%),
        radial-gradient(circle at 62% 18%, rgba(12,26,34,.95) 0 14%, transparent 15%),
        radial-gradient(circle at 78% 62%, rgba(12,26,34,.96) 0 18%, transparent 19%),
        radial-gradient(circle at 38% 74%, rgba(12,26,34,.95) 0 15%, transparent 16%),
        radial-gradient(circle at 52% 45%, rgba(12,26,34,.92) 0 26%, transparent 27%)}
  .ink.on{opacity:1}
  .feed{position:relative;z-index:2;font-size:11px;color:var(--ink2);text-align:center;

  }
  /* ============ V2.0 章节障碍：海草锁 / 贝壳壳层（自绘 SVG，缩到多小都不糊） ============ */
  .card .obst{position:absolute;inset:-3%;z-index:5;pointer-events:none;
    display:grid;place-items:center}
  .card .obst svg{width:100%;height:100%;display:block}
  /* 贝壳：暖白扇贝 + 放射纹，缩一圈露出牌边底色，玩家能猜个大概 */
  .card .obst.shell{inset:-1%}
  .card .obst.shell svg{filter:drop-shadow(0 2px 3px rgba(120,84,48,.26))}
  .card .obst.shell .n{position:absolute;right:3%;top:-2%;
    min-width:19px;height:19px;padding:0 4px;border-radius:999px;
    display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#5A3E1E;
    background:linear-gradient(180deg,#FFF3D6,#FFD98A);
    box-shadow:0 1px 3px rgba(90,60,20,.35),inset 0 1px 0 rgba(255,255,255,.9)}
  /* 海草：只画几条藤蔓 + 一个结，中间留白让鱼还认得出，否则玩家没法规划三消 */
  .card .obst.weed svg{filter:drop-shadow(0 1px 2px rgba(10,60,40,.32))}
  .card.shellCrack{animation:shellCrack .26s ease-out}
  @keyframes shellCrack{0%{transform:scale(1)}40%{transform:scale(1.06) rotate(-2deg)}100%{transform:scale(1)}}
  .card.weedBreak .obst.weed{animation:weedFade .45s ease-out forwards}

  /* 锁住的牌不用「被压住」的灰罩，只轻微降饱和：一眼看出是「锁」不是「被压」 */
  .card.weedlocked{filter:saturate(.94) brightness(.99);cursor:default;
    box-shadow:0 calc(var(--d)*1.1px + 3px) calc(var(--d)*1.8px + 7px) rgba(24,90,64,.24),
               inset 0 0 0 1px rgba(40,130,96,.22)}

    filter:drop-shadow(0 2px 2.4px rgba(20,60,80,.28))}

    filter:drop-shadow(0 3px 3px rgba(20,60,80,.3))}

  /* ============ V2.0 §8 画质分级：流畅档 ============ */

function mEye(cx, cy, r, glow){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#050A0D"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r*0.74).toFixed(1) + '" fill="' + (glow||'#FF6B4A') + '"/>' +
    '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (r*0.2).toFixed(1) + '" ry="' + (r*0.6).toFixed(1) + '" fill="#0A0406"/>' +
    '<circle cx="' + (cx - r*0.34).toFixed(1) + '" cy="' + (cy - r*0.34).toFixed(1) + '" r="' + (r*0.14).toFixed(1) + '" fill="#fff" opacity=".85"/>';
}
function mFangs(x, y, w, n, h, color){
  let out = '', step = w / n;
  for(let i=0;i<n;i++){
    const x1 = x + i*step, x2 = x1 + step, xm = (x1+x2)/2;
    out += '<path d="M' + x1.toFixed(1) + ' ' + y + ' L' + xm.toFixed(1) + ' ' + (y+h).toFixed(1) +
           ' L' + x2.toFixed(1) + ' ' + y + ' Z" fill="' + (color||'#EFE4D2') + '"/>';
  }
  return out;
}

/* ============================ 音效 ============================ */
/* =====================================================================
   V2.0 音频系统 · 程序化合成（零音频文件，体积全部是代码）
   · 6 首场景 BGM + 1 首通关主题 + 30 个交互音效
   · 循环方式：同一个 AudioContext 时钟按 16 分音符无限续排 → 天然无缝
   · 总线：各轨 gain → bgm/sfx bus → 压缩 → 主输出，另有程序生成的混响
   ===================================================================== */
const Sound = (function(){
  let ac = null, master, comp, bgmBus, sfxBus, revSend, reverb, noiseBuf = null;
  let on = true, bgmVol = .40, sfxVol = .72;
  let cur = null, timer = 0, lastBgm = '', probeAn = null;

  function ensure(){
    if(ac){
      if(ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
      return ac;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ ac = new AC(); }catch(e){ return null; }
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 3;
    comp.attack.value = .005; comp.release.value = .24;
    master = ac.createGain(); master.gain.value = .95;
    bgmBus = ac.createGain(); bgmBus.gain.value = bgmVol;
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxVol;
    reverb = ac.createConvolver();
    reverb.buffer = makeIR(2.8, 2.4);
    revSend = ac.createGain(); revSend.gain.value = .55;
    bgmBus.connect(comp); sfxBus.connect(comp);
    bgmBus.connect(revSend); sfxBus.connect(revSend);
    revSend.connect(reverb); reverb.connect(comp);
    comp.connect(master); master.connect(ac.destination);
    return ac;
  }

  /* 程序生成脉冲响应：噪声 × 指数衰减，做成海底那种长尾混响 */
  function makeIR(dur, decay){
    const rate = ac.sampleRate, len = Math.floor(rate * dur);
    const buf = ac.createBuffer(2, len, rate);
    for(let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for(let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  const hz = n => 440 * Math.pow(2, (n - 69) / 12);

  /* 单音：振荡器 + 可选滤波 + ADSR + 声像 + 混响送出 */
  function tone(o){
    if(!on) return;
    const c = ensure(); if(!c) return;
    const dur = o.dur || .2;
    const t0 = c.currentTime + (o.at || 0);
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(20, o.f), t0);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + dur);
    if(o.detune) osc.detune.setValueAtTime(o.detune, t0);

    let node = osc;
    if(o.filter){
      const bq = c.createBiquadFilter();
      bq.type = o.filterType || 'lowpass';
      bq.frequency.setValueAtTime(o.filter, t0);
      if(o.filter2) bq.frequency.exponentialRampToValueAtTime(Math.max(60, o.filter2), t0 + dur);
      bq.Q.value = o.q || 1;
      node.connect(bq); node = bq;
    }

    const g = c.createGain();
    const peak = o.gain == null ? .1 : o.gain;
    const atk = Math.max(.002, o.attack == null ? .008 : o.attack);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t0 + Math.min(atk, dur * .5));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    node.connect(g);

    let out = g;
    if(o.pan != null && c.createStereoPanner){
      const p = c.createStereoPanner();
      p.pan.value = clamp(o.pan, -1, 1);
      g.connect(p); out = p;
    }
    out.connect(o.bus || sfxBus);
    if(o.send){
      const s = c.createGain(); s.gain.value = o.send;
      out.connect(s); s.connect(reverb);
    }
    osc.start(t0);
    osc.stop(t0 + dur + .06);
  }

  function getNoise(){
    if(noiseBuf) return noiseBuf;
    const len = Math.floor(ac.sampleRate * 2);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  /* 噪声：水泡尾巴、海浪、碎裂、风声都用它 */
  function hiss(o){
    if(!on) return;
    const c = ensure(); if(!c) return;
    const dur = o.dur || .2;
    const t0 = c.currentTime + (o.at || 0);
    const src = c.createBufferSource();
    src.buffer = getNoise(); src.loop = true;
    const bq = c.createBiquadFilter();
    bq.type = o.type || 'bandpass';
    bq.frequency.setValueAtTime(Math.max(60, o.f || 900), t0);
    if(o.f2) bq.frequency.exponentialRampToValueAtTime(Math.max(60, o.f2), t0 + dur);
    bq.Q.value = o.q || 1.2;
    const g = c.createGain();
    const peak = o.gain == null ? .09 : o.gain;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t0 + (o.attack || .012));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bq); bq.connect(g); g.connect(o.bus || sfxBus);
    if(o.send){ const s = c.createGain(); s.gain.value = o.send; g.connect(s); s.connect(reverb); }
    src.start(t0); src.stop(t0 + dur + .04);
  }

  /* 水泡：短促上滑正弦，整套音效里最“海底”的一个音色 */
  function bubble(f, at, gain, pan){
    tone({ f: f, f2: f * 1.9, dur: .11, type: 'sine', gain: gain == null ? .07 : gain,
           attack: .004, pan: pan, send: .25, at: at });
  }

  /* ---------------- 音效 ---------------- */
  const SFX = {
    /* UI */
    tap(){ bubble(680, 0, .05); },
    back(){ tone({ f: 520, f2: 380, dur: .12, type: 'sine', gain: .06 }); },
    open(){ hiss({ f: 700, f2: 1700, dur: .2, gain: .05, q: .8 });
            tone({ f: 620, f2: 900, dur: .15, gain: .05, send: .3 }); },
    close(){ hiss({ f: 1500, f2: 600, dur: .17, gain: .045, q: .8 }); },
    toggle(v){ tone({ f: v ? 620 : 420, f2: v ? 900 : 320, dur: .1, gain: .05 }); },
    claim(){ [740, 988, 1245].forEach((f, i) => tone({ f: f, dur: .14, type: 'triangle', gain: .08, at: i * .06, send: .3 })); },

    /* 消除 */
    pick(){ bubble(760, 0, .06); hiss({ f: 1800, f2: 900, dur: .09, gain: .035, q: 1.6 }); },
    match(n){
      const k = Math.min(5, Math.max(1, n || 1));
      const base = 620 * Math.pow(1.12, k - 1);
      [0, .05, .1].forEach((d, i) => tone({ f: base * (1 + i * .26), dur: .16, type: 'triangle', gain: .075, at: d, send: .35 }));
      bubble(base * 2, .04, .05);
      if(k >= 3) tone({ f: base * 2.1, dur: .24, type: 'sine', gain: .05, at: .1, send: .5 });
    },

             attack: K.bass.atk, filter: K.bass.filter, at: at, bus: bus });
    }
    if(s === 0){
      chord.forEach((n, i) => {
        tone({ f: hz(n), dur: K.pad.dur, type: K.pad.type, gain: K.pad.gain * V,
               attack: K.pad.atk, filter: K.pad.filter, filter2: K.pad.filter2,
               at: at, bus: bus, send: .3,
               pan: chord.length > 1 ? (i / (chord.length - 1)) * 1.1 - .55 : 0 });
      });
    }
    if(T.arp && s % T.arp.every === 0){
      const idx = T.arp.pattern[Math.floor(step / T.arp.every) % T.arp.pattern.length];
      const n = chord[idx % chord.length] + (T.arp.oct || 0);
      tone({ f: hz(n), dur: K.arp.dur, type: K.arp.type, gain: K.arp.gain * V,
             attack: K.arp.atk, filter: K.arp.filter, at: at, bus: bus,
             pan: ((step % 8) / 8) * 1.0 - .5, send: K.arp.send });
    }
    if(T.mel){
      for(let i = 0; i < T.mel.length; i++){
        const m = T.mel[i];
        if(m[0] === step){

                 type: K.mel.type, gain: K.mel.gain * V, attack: K.mel.atk,
                 filter: K.mel.filter, filter2: K.mel.filter2, at: at, bus: bus, send: K.mel.send });
        }
      }
    }
    if(T.pulse && (s === 0 || s === 10)){
      tone({ f: 58, f2: 40, dur: .22, type: 'sine', gain: .10, at: at, bus: bus });

/* ============================ 牌阵生成 ============================ */
function makePositions(cfg, seed){
  const r = seeded(seed);
  const mask = MASKS[cfg.mask];
  const rows = mask.length, cols = mask[0].length;
  const cells = [];
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) if(mask[y][x] === '1') cells.push({x, y});
  const cx = (cols-1)/2, cy = (rows-1)/2;
  const N = cfg.T * cfg.k;
  const L = cfg.L;
  const counts = [];
  let left = N;
  for(let i=0;i<L;i++){ const c = Math.min(Math.floor(left/(L-i)) + (i===0 ? left%(L-i) : 0), cells.length); counts.push(c); left -= c; }
  while(left > 0){
    let placed = false;
    for(let i=0;i<L && left>0;i++){ if(counts[i] < cells.length){ counts[i]++; left--; placed = true; } }
    if(!placed) break;
  }
  const maxCount = Math.max.apply(null, counts);
  const compact = 0.6 + cfg.dens * 1.6;
  const base = cells.map(c=>{
    const d = Math.hypot((c.x-cx)*1.15, c.y-cy);
    return {c, s: d*compact*0.6 + r()*(1.9 - cfg.dens*1.1)};
  }).sort((a,b)=>a.s-b.s).slice(0, maxCount).map(o=>o.c);

  const pos = [];
  for(let l=0;l<L;l++){
    const off = (l % 2 === 1) ? 0.5 : 0;   // 奇偶错位：上层压住下层四分之一，形成砖砌遮挡
    const subset = base.slice(0, counts[l]);
    for(const c of subset){
      pos.push({
        layer:l,
        cx: c.x + off + (r()-0.5)*0.02,
        cy: c.y + off + (r()-0.5)*0.02
      });
    }
  }
  return pos;
}

function buildLevel(levelId){
  const cfg = LV[levelId-1];
  const [name, L, T, k, mask, dens, wild, hidden] = cfg;
  const conf = {L, T, k, mask, dens};
  const N = T*k;
  const seed = 1000 + levelId*7919;
  const r = seeded(seed);
  let pos = makePositions(conf, seed);
  // 容量不足时按 3 的倍数补齐/裁剪
  while(pos.length < N){ pos = pos.concat(pos.slice(0, Math.min(3, N-pos.length))); }
  if(pos.length > N) pos = pos.slice(0, N - (N % 3));

  const WCELL = 0.94;
  const cards = pos.map((p, i)=>({
    id:i, layer:p.layer, cx:p.cx, cy:p.cy, wCell:WCELL, hCell:WCELL,
    type:null, state:'board', hidden:false, coverers:[]
  }));

  // 覆盖关系
  for(const a of cards){
    for(const b of cards){
      if(b.layer <= a.layer) continue;
      if(b.cx < a.cx + WCELL && b.cx + WCELL > a.cx && b.cy < a.cy + WCELL && b.cy + WCELL > a.cy){
        a.coverers.push(b.id);
      }
    }
  }

  // 构造性生成：保证一定可解（槽位峰值 ≤ 3）
  const byId = {}; cards.forEach(c=>byId[c.id]=c);
  const active = new Set(cards.map(c=>c.id));
  function clickableIn(set){
    const out = [];
    for(const id of set){ if(isFree(byId[id], set, byId)) out.push(id); }
    return out;
  }
  const trios = [];
  while(active.size >= 3){
    const trio = [];
    while(trio.length < 3){
      const cl = clickableIn(active);
      if(!cl.length) break;
      const id = cl[Math.floor(r()*cl.length)];
      trio.push(id); active.delete(id);
    }
    if(trio.length < 3) break;
    trios.push(trio);
  }

  // 分配类型：每种 k 张 = 每 k/3 组
  const perType = Math.max(1, Math.floor(k/3));
  // 鱼种轮换：不同关卡看到不同的鱼，早期关固定用最好认的前几种
  /* V2.1：牌面只从「已经有 3D 资产」的物种里抽。
     否则关卡按 (关卡×7)%87 轮转，会翻到还没做完的物种，出现 3D 与矢量混排。
     随着资产补全，可用池自动变大，不需要改关卡表。 */
  const READY = (typeof FISH_SPRITES !== 'undefined')
    ? Object.keys(FISH_SPRITES).map(Number).sort((x, y) => x - y) : null;
  const useReady = READY && READY.length >= Math.max(4, T);
  const SPECIES = useReady ? READY.length : PALETTE.length;
  const rot = levelId <= 3 ? 0 : (levelId * 7) % SPECIES;
  const typeOf = t => useReady ? READY[(rot + t) % SPECIES] : (rot + t) % SPECIES;
  let typeList = [];
  for(let t=0;t<T;t++) for(let i=0;i<perType;i++) typeList.push(typeOf(t));
  if(wild > 0 && typeList.length > 0){
    // 用一组魔法鱼替换掉某一组，保持总数
    const idx = typeList.findIndex((v, i2)=> i2>0 && v !== typeList[0]) ;
    const drop = idx > 0 ? idx : typeList.length-1;
    typeList.splice(drop,1);
    typeList.push('W');
  }
  typeList = shuffle(typeList, r);
  trios.forEach((trio, i)=>{
    const t = typeList[i % typeList.length];
    trio.forEach(id=>{ byId[id].type = t; });
  });

  // 陷阱：把求解顺序最前面的 N 张改成互不相同的类型（保持每种总数不变）
  const fx = LEVEL_FX[levelId] || {};
  if(fx.scatter){
    const order = [].concat.apply([], trios);
    const pool = shuffle(cards.map(c=>c.type), r);
    const used = new Set(), head = [], rest = [];
    for(const t of pool){
      if(head.length < fx.scatter && !used.has(t)){ head.push(t); used.add(t); }
      else rest.push(t);
    }
    const assign = head.concat(rest);
    order.forEach((id, i)=>{ if(assign[i] !== undefined) byId[id].type = assign[i]; });
  }

  // 暗牌：盖着看不到图案，点开才知道
  if(fx.blind){
    const pool2 = shuffle(cards.map(c=>c.id), r);
    const cnt2 = Math.floor(cards.length * fx.blind);
    for(let i = 0; i < cnt2; i++) byId[pool2[i]].blind = true;
    // 其中有约 1/5 是鮟鱇鱼：点开会吃掉一格
    const badPool = cards.filter(c=>c.blind);
    const badN = Math.floor(badPool.length * 0.2);
    shuffle(badPool, r).slice(0, badN).forEach(c=>{ c.bad = true; });
  }

  // 冰冻：只能从“靠后期才被点”的牌里挑，保证前期路线不被堵死
  if(fx.freeze){
    const orderAll = [].concat.apply([], trios);
    const late = orderAll.slice(Math.floor(orderAll.length * 0.45));
    const pool3 = shuffle(late, r);
    let placed = 0;
    for(const id of pool3){
      if(placed >= fx.freeze) break;
      const c = byId[id];
      if(c.frozen) continue;
      let nb = 0;
      for(const o of cards){
        if(o.id === c.id) continue;
        if(Math.abs(o.cx - c.cx) < 1.3 && Math.abs(o.cy - c.cy) < 1.3) nb++;
      }
      if(nb < 2) continue;
      c.frozen = true;
      c.ice = (cfg.levelId % 10 === 0) ? 3 : 2;
      placed++;
    }
  }

  // V2.0 章节障碍：贝壳壳层（21–30）/ 海草锁（31–40）
  // 同样只挑「后半段才被点」的牌，保证开局路线不被堵死；不与冰冻、暗牌叠加。
  if(fx.shell || fx.weed){
    const order2 = [].concat.apply([], trios);
    const shellTotal = fx.shell || 0, weedTotal = fx.weed || 0;
    // 贝壳壳层：牌本身可点（只是要多点一次），不会堵路 —— 放到浅层，玩家一开局就看得见
    if(shellTotal){
      // layer 越大越靠上（zIndex = layer*100），所以按层号降序挑才挑得到「一眼能看见」的牌
      const allSorted = shuffle(cards.map(c => c.id), r).sort((a, b) => byId[b].layer - byId[a].layer);
      let n = 0;
      for(const id of allSorted){
        if(n >= shellTotal) break;
        const c = byId[id];
        if(c.frozen || c.blind || c.shell || c.weed) continue;
        c.shell = (levelId % 10 === 0) ? 2 : 1;
        n++;
      }
    }
    // 海草锁：缠住就点不动，只能落在后半段，避免开局把唯一可点的牌锁死
    if(weedTotal){
      const late2 = order2.slice(Math.floor(order2.length * 0.35));
      const poolW = shuffle(late2, r).sort((a, b) => byId[b].layer - byId[a].layer);
      let n = 0;
      for(const id of poolW){
        if(n >= weedTotal) break;
        const c = byId[id];
        if(c.frozen || c.blind || c.shell || c.weed) continue;
        c.weed = (levelId % 10 === 0 || levelId % 10 === 9) ? 2 : 1;
        n++;
      }
    }
  }

  // 迷雾
  if(hidden > 0){
    const pool = shuffle(cards.map(c=>c.id), r);
    const cnt = Math.floor(cards.length * Math.min(hidden, .5));
    for(let i=0;i<cnt;i++) byId[pool[i]].hidden = true;
  }

  return {cards, byId, name, cfg, conf, levelId, seed, drop: fx.drop || 0,
          slots: fx.slots || 7, time: fx.time || 0, boss: fx.boss || 0, oxygen: fx.oxygen || 0,
          current: !!fx.current};
}

/* ============================ 关卡状态 ============================ */
let S = null;
const slotEls = [];
function buildSlots(n){
  n = n || 7;
  const wrap = $('#slots'); wrap.innerHTML = ''; slotEls.length = 0;
  wrap.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
  for(let i=0;i<n;i++){
    const d = document.createElement('div'); d.className = 'slot'; wrap.appendChild(d); slotEls.push(d);
  }
}
buildSlots(7);

function startMeterTimer(){
  if(!S || (!S.timeLimit && !S.oxyMax)) return;
  if(S.timer) clearInterval(S.timer);
  S.timer = setInterval(function(){
    if(!S || S.status !== 'playing') return;
    if(S.timeLimit > 0){
      S.timeLeft--;
      if(S.timeLeft <= 0){ S.timeLeft = 0; updateHud(); lose(true); return; }
    }
    if(S.oxyMax){
      S.oxy -= 1 * (S.oxyMul || 1);
      if(S.oxy <= 0){ S.oxy = 0; updateHud(); lose(true); return; }
    }
    updateHud();
  }, 1000);
}

function newGame(levelId, buff){
  if(S && S.timer){ clearInterval(S.timer); }
  if(S && S.currentTimer){ clearInterval(S.currentTimer); }
  if(idleTimer){ clearInterval(idleTimer); idleTimer = null; }
  curShift = false;
  const data = buildLevel(levelId);
  const aqua = aquaBuff();
  const b = buff || {};
  const cap = (data.slots || 7) + aqua.slots + (b.slot ? 1 : 0);
  buildSlots(cap);
  if(b.ice){
    const fz = data.cards.filter(c=>c.frozen);
    shuffle(fz, Math.random).slice(0, Math.floor(fz.length / 2)).forEach(c=>{ c.frozen = false; c.ice = 0; });
  }
  if(b.luck) data.cards.forEach(c=>{ c.blind = false; });
  S = {
    levelId, data, capacity: cap, buffs: b, aqua,
    coinMul: 1 + aqua.coin + (b.coin ? 0.5 : 0),
    oxyMul: aqua.oxy * (b.oxy ? 0.7 : 1),
    cards: data.cards, byId: data.byId,
    slot: [], status:'playing',
    props:{undo:1 + aqua.undo + (b.undo2 ? 2 : 0), shuffle:1 + aqua.shuffle, grab:1 + aqua.grab + (b.grab ? 1 : 0)},
    propLeft:1, revived:false, dropLeft: data.drop || 0, drops: 0,
    nextId: 10000,
    peakSlot:0, usedProp:false,
    timeLimit: data.time || 0, timeLeft: data.time || 0,
    boss: data.boss ? {hp:data.boss, max:data.boss, locked:false, p1:false, p2:false, inkT:0} : null,
    oxyMax: data.oxygen || 0, oxy: data.oxygen || 0,
    startAt: Date.now(),
    clickable:new Set()
  };
  startMeterTimer();
  // 补给站买的道具：本关一次性带入
  const pend = progress.pendingProps || {};
  const pendN = (pend.undo || 0) + (pend.shuffle || 0) + (pend.grab || 0);
  if(pendN > 0){
    if(pend.undo) S.props.undo += pend.undo;
    if(pend.shuffle) S.props.shuffle += pend.shuffle;
    if(pend.grab) S.props.grab += pend.grab;
    progress.pendingProps = { undo:0, shuffle:0, grab:0 };
    save();
    setTimeout(()=>toast('补给已带入本关 · 道具 +' + pendN), 600);
  }

  S.abyss = (levelId === 60);
  if(S.abyss) abyssOn(); else abyssOff();
  document.body.dataset.rank = String(rankOf(levelId));
  $('#lvName').textContent = '第 ' + levelId + ' 关 · ' + data.name;
  renderBoard();
  refresh();
  renderSlot();
  updateHud();
  idleTimer = setInterval(cardIdleTick, 1000);
  diveLog(diveLine(levelId, data.cards.length));
  if(S.abyss) setTimeout(abyssIntro, 380);
  hubNotify('level', { levelId });
  startChapterFx(data);
}

/* V2.0 章节机制：海流节奏 + 首次出现时各教一次（策划案 §5.1「通过关卡教学循序引入」） */
function startChapterFx(data){
  if(data.current){
    const shift = ()=>{
      if(!S || S.status !== 'playing') return;
      curShift = true;
      relayout(); refresh();
      Sfx.current();
      showBanner('海流涌动', '牌正在漂 · 稳住手', 1200);
      setTimeout(()=>{
        if(!S) return;
        curShift = false;
        relayout(); refresh();
      }, 2100);
    };
    setTimeout(shift, 3200);                       // 首次提前一次，让机制一进门就被看见
    S.currentTimer = setInterval(shift, 14000);    // 之后回到常规节奏
  }
  if(data.cards.some(c => c.weed)) teachObstacle('weed');
  if(data.cards.some(c => c.shell)) teachObstacle('shell');
  if(data.current) teachObstacle('current');
}

function teachObstacle(kind){
  const key = 'seen_' + kind;
  if(progress[key]) return;
  progress[key] = true;
  save();
  const T = {
    weed:    ['海草锁', '被海草缠住的牌点不动。消掉任意一组，海草就松开一张。'],
    shell:   ['贝壳壳层', '贝壳牌要先点一次剥壳，壳掉光之后再点才收进槽。'],
    current: ['海流移动格', '这里的海流会定时涌动，牌会错开一下，涌动结束自动回位。']
  }[kind];
  if(!T) return;
  setTimeout(()=>showBanner(T[0], T[1], 2600), 1400);
}

/* ============================ 渲染 ============================ */
/* V2.0 障碍层图形：贝壳 = 暖白扇贝 + 放射纹；海草 = 几条藤蔓 + 一个结（中间留白让鱼还认得出） */
function shellSVG(){
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<defs><linearGradient id="shg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#FFFDF8"/><stop offset=".5" stop-color="#F8E9D2"/><stop offset="1" stop-color="#E3C29E"/>' +
    '</linearGradient></defs>' +
    '<path d="M50 86 C25 86 15 54 23 34 C31 15 69 15 77 34 C85 54 75 86 50 86 Z" fill="url(#shg)" stroke="#FFFFFF" stroke-width="3.6"/>' +
    '<g stroke="#D8B08A" stroke-width="2.2" fill="none" opacity=".9" stroke-linecap="round">' +
      '<path d="M50 83 L31 38"/><path d="M50 83 L40 26"/><path d="M50 83 L50 21"/>' +
      '<path d="M50 83 L60 26"/><path d="M50 83 L69 38"/>' +
    '</g>' +
    '<ellipse cx="50" cy="85" rx="9" ry="5" fill="#E6C49E" stroke="#FFFFFF" stroke-width="2"/>' +
  '</svg>';
}
function weedSVG(){
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<g fill="none" stroke-linecap="round">' +
      '<path d="M4 24 Q40 46 96 18" stroke="#2F8A64" stroke-width="8" opacity=".95"/>' +
      '<path d="M2 82 Q42 60 98 84" stroke="#39A075" stroke-width="7" opacity=".92"/>' +
      '<path d="M20 2 Q34 46 18 98" stroke="#37A276" stroke-width="7" opacity=".9"/>' +
      '<path d="M78 4 Q92 44 76 98" stroke="#2C8060" stroke-width="6" opacity=".86"/>' +
    '</g>' +
    '<g fill="#7FD6A0" opacity=".6">' +
      '<ellipse cx="26" cy="33" rx="7" ry="4" transform="rotate(-24 26 33)"/>' +
      '<ellipse cx="74" cy="62" rx="7" ry="4" transform="rotate(22 74 62)"/>' +
      '<ellipse cx="40" cy="78" rx="6" ry="3.5" transform="rotate(-12 40 78)"/>' +
    '</g>' +
    '<circle cx="50" cy="50" r="13" fill="#4FB886" stroke="#FFFFFF" stroke-width="2.6"/>' +
    '<circle cx="50" cy="50" r="5" fill="#2C7C5C"/>' +
  '</svg>';
}

let layout = {unit:0, ox:0, oy:0, boardW:0, boardH:0};
/* 海流移动格：按层反向错位。只改视觉位置与可点判定，不动牌阵数据，涌动结束即回位。
   用独立开关而不是读 S，避免关卡生成阶段（S 还是上一局）被误偏移。 */
let curShift = false;
function layerDx(layer){ return curShift ? ((layer % 2 ? -1 : 1) * 0.34) : 0; }
function computeLayout(){
  const wrap = $('.board-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const c of S.cards){
    minX = Math.min(minX, c.cx); minY = Math.min(minY, c.cy);
    maxX = Math.max(maxX, c.cx + c.wCell); maxY = Math.max(maxY, c.cy + c.hCell);
  }
  const bw = maxX-minX, bh = maxY-minY;
  let unit = Math.min((W - 8) / bw, (H - 8) / bh);
  unit = Math.min(unit, 110);
  layout = { unit, ox:(W - bw*unit)/2 - minX*unit, oy:(H - bh*unit)/2 - minY*unit, boardW:W, boardH:H };
}

function makeCardEl(c){
  const el = document.createElement('div');
  el.className = 'card';
  el.style.width = el.style.height = (layout.unit * c.wCell) + 'px';
  el.style.left = (layout.ox + (c.cx + layerDx(c.layer)) * layout.unit) + 'px';
  el.style.top  = (layout.oy + c.cy * layout.unit) + 'px';
  el.style.zIndex = c.layer * 100 + Math.round(c.cy * 2);
  el.style.setProperty('--d', String(c.layer));
  if(S && S.abyss){
    el.style.background = c.type === 'W'
      ? 'linear-gradient(160deg,#4A3320,#2A1A12)'
      : 'linear-gradient(160deg,#2E3F4A,#182229)';
  } else {
    el.style.background = c.type === 'W' ? 'linear-gradient(160deg,#FFF3D0,#FFD98A)' : ('linear-gradient(160deg,#fff,' + PALETTE[c.type].bg + ')');
  }
  if(c.type === 'W') el.classList.add('wild');
  el.innerHTML = '<div class="hit"></div><div class="gloss"></div>' + cardSVG(c.type) + '<div class="qmark">?</div>' +
                 (c.shell ? '<div class="obst shell">' + shellSVG() + '<b class="n">' + c.shell + '</b></div>' : '') +
                 (c.weed ? '<div class="obst weed">' + weedSVG() + '</div>' : '');
  el.dataset.id = c.id;
  $('#board').appendChild(el);
  c.el = el;
  return el;
}

function renderBoard(){
  const board = $('#board'); board.innerHTML = '';
  computeLayout();
  for(const c of S.cards){ if(c.state !== 'gone') makeCardEl(c); }
}

function relayout(){
  if(!S) return;
  computeLayout();
  for(const c of S.cards){
    if(!c.el) continue;
    c.el.style.width = c.el.style.height = (layout.unit * c.wCell) + 'px';
    c.el.style.left = (layout.ox + (c.cx + layerDx(c.layer)) * layout.unit) + 'px';
    c.el.style.top  = (layout.oy + c.cy * layout.unit) + 'px';
  }
}
window.addEventListener('resize', relayout);

function isFree(card, activeSet, byId){
  if(!card.coverers.length) return true;
  let vis = 0;
  const dx = layerDx(card.layer);
  for(let i=0;i<10;i++){
    for(let j=0;j<10;j++){
      const px = card.cx + dx + card.wCell*((i+0.5)/10);
      const py = card.cy + card.hCell*((j+0.5)/10);
      let cov = false;
      for(const k of card.coverers){
        if(!activeSet.has(k)) continue;
        const o = byId[k];
        const odx = layerDx(o.layer);
        if(px>o.cx+odx && px<o.cx+odx+o.wCell && py>o.cy && py<o.cy+o.hCell){ cov = true; break; }
      }
      if(!cov) vis++;
    }
  }
  return vis >= (STRICT_CLICK ? 100 : 12);
}

function computeClickable(){
  const out = new Set();
  const active = new Set();
  for(const c of S.cards) if(c.state === 'board') active.add(c.id);
  for(const c of S.cards){
    if(c.state !== 'board') continue;
    if(c.weed) continue;                 // 海草锁：缠住时不可点
    if(isFree(c, active, S.byId)) out.add(c.id);
  }
  // 兜底：场上已经没有可点的牌、只剩被海草缠住的，强制松一张，避免死局
  if(out.size === 0){
    const locked = S.cards.filter(c => c.state === 'board' && c.weed > 0);
    if(locked.length){
      locked.sort((a, b) => b.layer - a.layer);
      const c0 = locked[0];
      c0.weed = 0;
      if(c0.el){
        const w = c0.el.querySelector('.obst.weed');
        if(w) w.remove();
        c0.el.classList.remove('weedlocked');
      }
      return computeClickable();
    }
  }
  return out;
}

function refresh(){
  S.clickable = computeClickable();
  for(const c of S.cards){
    if(!c.el) continue;
    const weedLocked = c.state === 'board' && !!c.weed;
    const ok = c.state === 'board' && S.clickable.has(c.id);
    c.el.classList.toggle('dim', c.state === 'board' && !ok && !weedLocked);
    const hide = c.state === 'board' && (c.blind || (c.hidden && !ok));
    c.el.classList.toggle('hidden', hide);
    c.el.classList.toggle('frozen', !!c.frozen && c.state === 'board');
    c.el.classList.toggle('weedlocked', c.state === 'board' && !!c.weed);
    c.el.classList.toggle('breathe', ok && !c.blind);
  }
  updateHud();
}

function updateHud(){
  const left = S.cards.filter(c=>c.state !== 'gone').length;
  $('#leftCount').textContent = '剩余 ' + left + ' 张';
  const cap = S.capacity;
  const pill = $('#slotPill');
  pill.textContent = '槽位 ' + S.slot.length + '/' + cap;
  pill.classList.toggle('warn', S.slot.length === cap - 2);
  pill.classList.toggle('danger', S.slot.length >= cap - 1);
  $('#tray').classList.toggle('danger', S.slot.length >= cap - 1 && S.status === 'playing');
  const st = $('#subText'), sl = $('#subLabel');
  if(st && sl){
    st.textContent = '生命维持舱 ' + S.slot.length + '/' + cap;
    sl.classList.toggle('danger', S.slot.length >= cap - 1 && S.status === 'playing');
  }
  if($('#bossWrap')){
    const bw = $('#bossWrap');
    if(S.boss){
      bw.style.display = '';
      $('#bossHp').style.width = Math.max(0, (S.boss.hp / S.boss.max) * 100) + '%';
      $('#bossName').textContent = (S.abyss ? '深渊之主 ' : '大章鱼 ') + Math.ceil(S.boss.hp) + '/' + S.boss.max;
    } else bw.style.display = 'none';
  }
  if($('#oxyWrap')){
    const ow = $('#oxyWrap');
    if(S.oxyMax){
      ow.style.display = '';
      const p = Math.max(0, S.oxy / S.oxyMax);
      $('#oxyFill').style.width = (p * 100) + '%';
      ow.classList.toggle('low', p < 0.3);
    } else ow.style.display = 'none';
  }
  const feed = $('#feed');
  if(feed){
    const sos = S.status === 'playing' && S.slot.length >= cap - 1;
    feed.classList.toggle('sos', sos);
    if(sos) feed.textContent = '危！就差一张 · 点这里捞捞我（求好友）';
    else if(feed.classList.contains('sos')) feed.textContent = Net.feed();
  }
  if(S.lastSlot !== S.slot.length){
    if(S.slot.length === 5 && S.lastSlot < 5) toast(quip('slot5'));
    if(S.slot.length >= S.capacity - 1 && S.slot.length > 5) toast(quip('slot6'));
    S.lastSlot = S.slot.length;
  }
  const rk = RANKS[rankOf(S.levelId)];
  const rc = $('#rankChip');
  if(rc){ rc.textContent = rk.name; rc.style.background = rk.color; }
  const tp = $('#timePill');
  if(tp){
    if(S.timeLimit > 0){
      const t = Math.max(0, S.timeLeft);
      tp.style.display = '';
      tp.textContent = '⏱ ' + String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
      tp.classList.toggle('danger', t <= 20);
    } else { tp.style.display = 'none'; }
  }
  const P = S.props || {undo:1, shuffle:1, grab:1};
  if($('#cntUndo')) $('#cntUndo').textContent = P.undo;
  if($('#cntShuffle')) $('#cntShuffle').textContent = P.shuffle;
  if($('#cntGrab')) $('#cntGrab').textContent = P.grab;
  if($('#btnUndo')) $('#btnUndo').classList.toggle('off', P.undo <= 0);
  if($('#btnShuffle')) $('#btnShuffle').classList.toggle('off', P.shuffle <= 0);
  if($('#btnGrab')) $('#btnGrab').classList.toggle('off', P.grab <= 0);
  document.title = '捞捞小鱼 · 第 ' + S.levelId + ' 关 · ' + S.data.name;
  if(location.search.indexOf('dbg') >= 0){
    const frz = S.cards.filter(c=>c.frozen && c.state === 'board').length;
    const bl = S.cards.filter(c=>c.blind && c.state === 'board').length;
    document.title = 'L' + S.levelId + ' 剩' + left + ' 容' + S.capacity + ' 槽' + S.slot.length +
      ' 可点' + S.clickable.size + ' 冰' + frz + ' 盲' + bl + ' 时' + S.timeLeft +
      (S.boss ? ' 血' + Math.round(S.boss.hp) : '') + (S.oxyMax ? ' 氧' + Math.round(S.oxy) : '') +
      ' 币' + (progress.coins||0) + ' 滴' + (progress.drops||0) +
      (S.status !== 'playing' ? ' ' + S.status : '');
  }
}

function renderSlot(){
  for(let i=0;i<S.capacity;i++){
    const el = slotEls[i];
    const card = S.slot[i];
    el.className = 'slot' + (card ? ' full' : '');
    el.innerHTML = card ? cardSVG(card.type) : '';
  }
}

/* ============================ 交互 ============================ */
let inputLockUntil = 0;
$('#board').addEventListener('click', e=>{
  if(e.detail > 1) return;              // 双击/连击的后续点击直接忽略
  if(Date.now() < inputLockUntil) return;
  const el = e.target.closest('.card');
  if(!el || !S || S.status !== 'playing') return;
  const card = S.byId[+el.dataset.id];
  if(!card || card.state !== 'board') return;
  if(card.frozen){
    Sfx.deny();
    const el2 = card.el;
    if(el2){ el2.classList.add('shake'); setTimeout(()=>el2.classList.remove('shake'), 260); }
    toast('先清掉旁边的牌，冰才会化', true);
    return;
  }
  if(card.weed){
    Sfx.blocked();
    const el2 = card.el;
    if(el2){ el2.classList.add('shake'); setTimeout(()=>el2.classList.remove('shake'), 260); }
    toast('海草缠着它 · 先消掉一组，海草才会松', true);
    return;
  }
  if(!S.clickable.has(card.id)){
    Sfx.deny();
    const el2 = card.el;
    if(el2){ el2.classList.add('shake'); setTimeout(()=>el2.classList.remove('shake'), 260); }
    return;
  }
  if(card.shell > 0){
    // V2.0 贝壳壳层：点一次剥一层，剥完才进槽（有明确反馈，不会白点）
    card.shell--;
    Sfx.crack();
    if(card.el){
      card.el.classList.add('shellCrack');
      setTimeout(()=>{ if(card.el) card.el.classList.remove('shellCrack'); }, 300);
      const r2 = card.el.getBoundingClientRect();
      FX.burst(r2.left + r2.width/2, r2.top + r2.height/2, '#E8D6B8', 8, 1.0);
      const ob = card.el.querySelector('.obst.shell');
      if(ob){
        if(card.shell > 0){ const nb = ob.querySelector('.n'); if(nb) nb.textContent = String(card.shell); }
        else ob.remove();
      }
    }
    toast(card.shell > 0 ? '贝壳还有 ' + card.shell + ' 层' : '贝壳破开了 · 再点一下就收进槽', true);
    inputLockUntil = Date.now() + 220;
    return;
  }
  pick(card);
  inputLockUntil = Date.now() + 300;
});

function slotTargetRect(index){
  const el = slotEls[Math.min(index, S.capacity - 1)];
  return el.getBoundingClientRect();
}

function pick(card){
  S.picks = (S.picks||0) + 1;
  if(card.el){ const b0 = card.el.querySelector('.bubble'); if(b0) b0.remove(); }
  if(card.el){
    const r0 = card.el.getBoundingClientRect();
    FX.bubbles(r0.left + r0.width/2, r0.top + r0.height/2, 4);
  }
  card.state = 'slot';
  Sfx.pick();
  if(card.bad){
    card.bad = false;
    if(S.capacity > 4){
      S.capacity -= 1;
      buildSlots(S.capacity);
      flashScreen(); screenShake(true);
      showBanner('鮟鱇鱼！', '它吃掉了一格槽位', 1100);
      toast('深海鮟鱇：这格我拿走了', true);
    }
  }
  if(S.cards.some(c=>c.frozen && c.state === 'board')){
    for(const c of S.cards){
      if(!c.frozen || c.state !== 'board') continue;
      if(Math.abs(c.cx - card.cx) < 1.35 && Math.abs(c.cy - card.cy) < 1.35){
        c.ice--;
        if(c.ice <= 0){
          c.frozen = false; c.ice = 0;
          Sfx.ice();
          if(c.el){
            const r1 = c.el.getBoundingClientRect();
            FX.burst(r1.left + r1.width/2, r1.top + r1.height/2, '#CFEFFA', 10, 1.1);
          }
        }
      }
    }
  }
  // 飞行动画
  const el = card.el;
  const r = el.getBoundingClientRect();
  const tr = slotTargetRect(S.slot.length);
  el.classList.add('fly');
  el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
  el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
  el.style.transition = 'transform .2s cubic-bezier(.4,0,.6,1), opacity .2s';
  el.style.transform = 'translate(' + (tr.left + tr.width/2 - (r.left + r.width/2)) + 'px,' +
                       (tr.top + tr.height/2 - (r.top + r.height/2)) + 'px) scale(.62)';
  setTimeout(()=>{ el.remove(); card.el = null; }, 210);

  S.slot.push(card);
  S.peakSlot = Math.max(S.peakSlot, S.slot.length);
  renderSlot();
  refresh();

  if(S.slot.length === S.capacity - 1) Sfx.danger();   // 只剩一格时的提示音
  setTimeout(()=>resolveMatches(), 60);
  setTimeout(()=>checkEnd(), 260);
}

function findMatch(){
  const slot = S.slot;
  const counts = {};
  let wilds = 0;
  for(const c of slot){ if(c.type === 'W') wilds++; else counts[c.type] = (counts[c.type]||0)+1; }
  for(const t in counts) if(counts[t] >= 3) return {type:+t, need:3, wild:0};
  if(wilds >= 1) for(const t in counts) if(counts[t] === 2) return {type:+t, need:2, wild:1};
  if(wilds >= 2) for(const t in counts) if(counts[t] === 1) return {type:+t, need:1, wild:2};
  if(wilds >= 3) return {type:'W', need:0, wild:3};
  return null;
}

/* V2.0 海草锁：每消掉一组，松开 n 张（按剩余层数从少到多），松开时有藤蔓断裂反馈 */
function releaseWeed(n){
  if(!S) return;
  const locked = S.cards.filter(c => c.state === 'board' && c.weed > 0);
  if(!locked.length) return;
  let budget = Math.max(1, n), opened = 0;
  locked.sort((a, b) => a.weed - b.weed);
  for(const c of locked){
    if(budget <= 0) break;
    c.weed--; budget--;
    if(c.weed <= 0){
      c.weed = 0; opened++;
      if(c.el){
        c.el.classList.add('weedBreak');
        const r = c.el.getBoundingClientRect();
        FX.burst(r.left + r.width/2, r.top + r.height/2, '#7FD6A0', 9, 1.1);
        setTimeout(()=>{
          if(!c.el) return;
          c.el.classList.remove('weedBreak');
          const w = c.el.querySelector('.obst.weed');
          if(w) w.remove();
        }, 460);
      }
    }
  }
  if(opened){ Sfx.weed(); toast('海草松开了 ' + opened + ' 张'); }
  refresh();
}

let comboDepth = 0;
function resolveMatches(){
  if(!S || S.status !== 'playing') return;
  let cleared = 0, clutch = false;
  let guard = 0;
  while(guard++ < 6){
    const m = findMatch();
    if(!m) break;
    const remove = [];
    if(m.wild === 0){
      remove.push(...S.slot.filter(c=>c.type === m.type).slice(0,3));
    } else {
      const same = S.slot.filter(c=>c.type === m.type).slice(0, m.need);
      const wildCards = S.slot.filter(c=>c.type === 'W').slice(0, m.wild);
      remove.push(...same, ...wildCards);
    }
    if(!remove.length) break;

    if(S.slot.length >= S.capacity) clutch = true;

    // 先记录爆炸锚点（移除后就取不到坐标了）
    const anchors = remove.map(c=>{
      const i = S.slot.indexOf(c);
      const r = slotEls[i] ? slotEls[i].getBoundingClientRect() : null;
      const pal = PALETTE[c.type];
      return {
        x: r ? r.left + r.width/2 : window.innerWidth/2,
        y: r ? r.top + r.height/2 : window.innerHeight*0.8,
        color: pal ? pal.bg : '#FFD27A'
      };
    });

    const idxs = remove.map(c=>S.slot.indexOf(c));
    idxs.forEach(i=>{ const el = slotEls[i]; el.querySelector('svg')?.classList.add('pop'); });
    S.slot = S.slot.filter(c=>!remove.includes(c));
    remove.forEach(c=>{ c.state = 'gone'; });
    cleared++;
    anchors.forEach((a, k)=> setTimeout(()=>FX.burst(a.x, a.y, a.color, 9, 1.05), k*24));
    setTimeout(renderSlot, 220);
  }

  if(cleared > 0){
    releaseWeed(cleared);              // 每消除一组，松开一张海草锁
    if(S.oxyMax) S.oxy = Math.min(S.oxyMax, S.oxy + 8 * cleared);
    if(S.boss && S.boss.locked){
      S.boss.locked = false;
      S.capacity += 1; buildSlots(S.capacity); renderSlot();
      toast('触手松开了！');
    }
    if(S.boss && S.boss.hp > 0){
      const dmg = cleared * ((S.buffs && S.buffs.boss) ? 1.5 : 1) * ((S.aqua && S.aqua.boss) || 1);
      S.boss.hp = Math.max(0, S.boss.hp - dmg);
      if(S.boss.hp <= 0){ bossDefeated(); return; }
      if(!S.boss.p1 && S.boss.hp <= S.boss.max * 0.66){ S.boss.p1 = true; bossAttack('ink'); }
      else if(!S.boss.p2 && S.boss.hp <= S.boss.max * 0.33){ S.boss.p2 = true; bossAttack('lock'); }
    }
    Sfx.match(cleared);
    screenShake(!!clutch);
    if(clutch){
      flashScreen();
      setTimeout(()=>showBanner('绝境反转！', '最后 7 格也能清屏', 1100), 110);
      FX.big(window.innerWidth/2, window.innerHeight*0.78, '#FFD98A');
    } else if(cleared >= 5){
      toast(quip('combo5') + ' x' + cleared);
    } else if(cleared >= 3){
      toast(quip('combo3') + ' x' + cleared);
    } else if(cleared === 2){
      toast('连捞 x2');
    }
    if(S.dropLeft > 0 && S.cards.some(c=>c.state === 'board') && Math.random() < 0.55){
      S.dropLeft--; S.drops++;
      setTimeout(dropTrio, 300);
    }
    setTimeout(()=>{ renderSlot(); refresh(); checkEnd(); }, 230);
  } else {
    renderSlot();
  }
}

function bossAttack(kind){
  if(!S || !S.boss) return;
  if(kind === 'ink'){
    const ink = $('#ink');
    ink.classList.add('on');
    S.boss.inkT = Date.now() + 3200;
    setTimeout(()=>{ if(S && Date.now() >= S.boss.inkT) ink.classList.remove('on'); }, 3200);
    toast('大章鱼喷墨了！看不清牌面了', true);
  } else if(S.capacity > 4){
    S.capacity -= 1;
    S.boss.locked = true;
    buildSlots(S.capacity); renderSlot(); refresh();
    toast('触手锁住了一格！消一组就松开', true);
  }
}

function bossDefeated(){
  if(!S || !S.boss) return;
  S.boss.hp = 0;
  if(S.boss.locked){ S.boss.locked = false; S.capacity += 1; buildSlots(S.capacity); }
  const ink = $('#ink'); if(ink) ink.classList.remove('on');
  showBanner('大章鱼逃走啦！', '剩下的鱼自己游回家了', 1400);
  flashScreen(); screenShake(true);
  FX.big(window.innerWidth/2, window.innerHeight*0.28, '#E2705A');
  Sfx.win();
  setTimeout(()=>{
    S.cards.forEach(c=>{ if(c.state === 'board'){ c.state = 'gone'; if(c.el) c.el.remove(); } });
    S.slot = []; renderSlot(); refresh();
    setTimeout(()=>{ if(S && S.status === 'playing') win(); }, 260);
  }, 780);
}

/* 随机掉落：一次掉 3 张同类（必须是 3 张，否则“每种 3 的倍数”就被破坏了） */
function dropTrio(){
  if(!S || S.status !== 'playing') return;
  const alive = S.cards.filter(c=>c.state !== 'gone' && c.type !== 'W');
  if(!alive.length) return;
  const t = alive[Math.floor(Math.random()*alive.length)].type;
  const topLayer = S.cards.reduce((m,c)=>Math.max(m,c.layer), -1) + 1;
  const xs = S.cards.map(c=>c.cx), ys = S.cards.map(c=>c.cy);
  const minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
  const minY = Math.min.apply(null,ys), maxY = Math.max.apply(null,ys);
  for(let i = 0; i < 3; i++){
    const cx = minX + Math.random()*(maxX-minX+0.01);
    const cy = minY + Math.random()*(maxY-minY+0.01);
    const card = { id: S.nextId++, layer:topLayer, cx, cy, wCell:0.94, hCell:0.94,
                   type:t, state:'board', hidden:false, blind:false, coverers:[] };
    for(const o of S.cards){
      if(o.state === 'gone' || o.layer >= card.layer) continue;
      if(o.cx < cx + 0.94 && o.cx + 0.94 > cx && o.cy < cy + 0.94 && o.cy + 0.94 > cy) o.coverers.push(card.id);
    }
    S.cards.push(card); S.byId[card.id] = card;
    const el = makeCardEl(card);
    el.classList.add('dropin');
  }
  toast('又有 3 张小鱼掉下来了！');
  refresh();
}

function checkEnd(){
  if(!S || S.status !== 'playing') return;
  const leftBoard = S.cards.some(c=>c.state === 'board');
  const leftAny = S.cards.some(c=>c.state !== 'gone');
  if(!leftAny){ win(); return; }
  // 牌阵翻空但槽里的牌凑不齐 —— 不能再让玩家干瞪眼
  if(!leftBoard && S.slot.length > 0 && !findMatch()){ lose(); return; }
  if(S.slot.length >= S.capacity && !findMatch()){ lose(); }
}

function localDayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function ensureDailyProgress(){
  const today = localDayKey();
  if(!progress.daily || progress.daily.date !== today){
    progress.daily = {date:today, wins:0, stars:0, newFish:0, coinsEarned:0, claimed:{}};
  }
  progress.daily.claimed = progress.daily.claimed || {};
  return progress.daily;
}
function win(){
  S.status = 'win';
  if(S.timer){ clearInterval(S.timer); S.timer = null; }
  if(idleTimer){ clearInterval(idleTimer); idleTimer = null; }
  Sfx.rescue();
  for(let i = 0; i < 5; i++){
    setTimeout(()=>FX.burst(
      window.innerWidth*(0.2 + Math.random()*0.6),
      window.innerHeight*(0.18 + Math.random()*0.25),
      ['#FFB5A7','#FFE29A','#B8E0D2','#A8DADC','#CDB4DB'][i%5], 16, 1.3), i*90);
  }
  const stars = (!S.usedProp && S.peakSlot <= 3) ? 3 : (!S.usedProp ? 2 : 1);
  Sfx.star(stars);
  hubNotify('win', { levelId: S.levelId, stars: stars });
  const prev = progress.stars[S.levelId] || 0;
  progress.stars[S.levelId] = Math.max(prev, stars);
  progress.max = Math.max(progress.max, Math.min(60, S.levelId + 1));
  const repeat = prev > 0;   // 这一关以前通过过 → 重复刷只给半价
  const coins = Math.round((10 + stars * 5 + (S.drops ? 5 : 0)) * (S.coinMul || 1) * (repeat ? 0.5 : 1));
  progress.coins = (progress.coins || 0) + coins;
  const dropsGain = Math.round((3 + stars) * ((S.aqua && S.aqua.drop) || 1));
  progress.drops = (progress.drops || 0) + dropsGain;
  progress.dex = progress.dex || {};
  const newDex = [];
  S.cards.forEach(c=>{
    if(c.type === 'W' || c.type === undefined) return;
    if(!progress.dex[c.type]){ progress.dex[c.type] = true; newDex.push(CREATURES[c.type] ? CREATURES[c.type].n : ''); }
  });
  const daily = ensureDailyProgress();
  daily.wins = (daily.wins || 0) + 1;
  daily.stars = (daily.stars || 0) + stars;
  daily.newFish = (daily.newFish || 0) + newDex.filter(Boolean).length;
  daily.coinsEarned = (daily.coinsEarned || 0) + coins;
  progress.stats = progress.stats || {};
  progress.stats.totalWins = (progress.stats.totalWins || 0) + 1;
  progress.stats.totalStars = (progress.stats.totalStars || 0) + stars;
  progress.stats.totalCoinsEarned = (progress.stats.totalCoinsEarned || 0) + coins;
  progress.xp = (progress.xp || 0) + 20 + stars * 10;
  save();
  const r0 = rankOf(S.levelId), r1 = rankOf(Math.min(60, S.levelId + 1));
  if(r1 > r0) setTimeout(()=>showBanner('晋升 · ' + RANKS[r1].name, '解锁新的海域背景', 1500), 500);
  const secs = Math.round((Date.now() - S.startAt)/1000);
  progress.medals = (progress.medals || 0) + 1;
  save();
  const survivors = S.cards.length;
  updateHud();
  if(S.abyss){
    diveLog('已上浮 · 深渊气压恢复 · 「深渊封印者」勋章已入册');
  } else {
    diveLog('返航 · 舱内 ' + survivors + ' 尾全部存活 · 颁发「海洋卫士」勋章');
  }
  showPanel(`
    <div class="medalrow">${medalSVG(S.abyss ? '深渊封印者' : '海洋卫士', S.abyss ? '#8A4A6E' : '#3E9A81')}</div>
    <h2>${S.abyss ? '深渊安静了…' : '耶！小鱼都回家啦～'}</h2>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>第 ${S.levelId} 关 · ${S.data.name} · ${secs} 秒</p>
    <p>${S.abyss ? '潜水艇上浮成功，它没能跟上来' : '潜水艇安全返航，' + survivors + ' 尾小鱼全部获救'}</p>
    ${newDex.filter(Boolean).length ? '<p style="font-size:12px;opacity:.82">🐠 ' + newDex.filter(Boolean).slice(0,3).join('、') + ' 已游进水族馆</p>' : ''}
    <p>峰值槽位 ${S.peakSlot}/${S.capacity}${S.usedProp ? ' · 用了道具' : ' · 没用道具'} · 累计勋章 ${progress.medals}</p>
    <p>+${coins} 金币 · +${dropsGain} 水滴${newDex.length ? ' · 新图鉴：' + newDex.join('、') : ''}</p>
    <div class="row">
      ${S.levelId < 60 ? '<button class="btn big pink" data-act="next">下一关</button>' : '<button class="btn big pink" data-act="levels">回到选关</button>'}
      <button class="btn big ghost" data-act="replay">再玩一次</button>
    </div>
  `);
  /* V2.0：结算写入全部完成后再通知大厅，驱动「获得—解锁—可见变化」入馆演出 */
  hubNotify('rescue', {
    levelId: S.levelId,
    names: newDex.filter(Boolean).slice(0, 3),
    coins: coins,
    drops: dropsGain
  });
}

function lose(byTime){
  S.status = 'lose';
  if(S.timer){ clearInterval(S.timer); S.timer = null; }
  progress.fails = progress.fails || {};
  progress.fails[S.levelId] = (progress.fails[S.levelId] || 0) + 1;
  save();
  hubNotify('lose', { levelId: S.levelId });

  if(S.abyss){
    // 第 60 关：不是 Game Over，是碎屏 + 触手把屏幕拉黑
    diveLog('信号中断 · 生命维持舱被拖入深渊…');
    abyssFailSeq();
    const hold = location.search.indexOf('hold') >= 0 ? 9000 : 1650;
    setTimeout(()=>{ if(S && S.status === 'lose') showLosePanel(byTime); }, hold);
    return;
  }

  Sfx.lose();
  screenShake(true);
  diveLog('警报 · 生命维持舱超载 · 紧急上浮');
  showLosePanel(byTime);
}

function showLosePanel(byTime){

    ? (left <= 8 ? '就差 ' + left + ' 张… 真的要被它吞了吗？' : '舱壁在响，还能再挣一次。')
    : (left <= 6 ? '就差 ' + left + ' 张牌了，真的不甘心！' : '再给你一次机会，要不要？');
  showPanel(`
    <div class="fishline">${S.abyss ? monsterSVG(4) : fishSVG(0)}</div>
    <h2>${head}</h2>
    <p>第 ${S.levelId} 关 · ${S.data.name}${byTime ? '' : ' · 还剩 ' + left + ' 张'}</p>

function buildCracks(){
  const svg = document.getElementById('crackSvg');
  if(!svg || svg.dataset.done) return;
  svg.dataset.done = '1';
  const cx = 50, cy = 44;
  let out = '';
  for(let i = 0; i < 10; i++){
    const a0 = (i / 10) * Math.PI * 2 + Math.random() * 0.35;
    let x = cx, y = cy, d = 'M' + cx + ' ' + cy;
    const segs = 4 + Math.floor(Math.random() * 3);
    for(let k = 0; k < segs; k++){
      const len = 5 + Math.random() * 8;
      const a = a0 + (Math.random() - 0.5) * 0.55;
      x += Math.cos(a) * len; y += Math.sin(a) * len;
      d += ' L' + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    out += '<path class="' + (i < 3 ? 'big' : '') + '" d="' + d + '"/>';
    // 分叉
    for(let b = 0; b < 2; b++){
      const t = 0.35 + Math.random() * 0.5;
      const bx = cx + (x - cx) * t, by = cy + (y - cy) * t;
      const ba = a0 + (Math.random() - 0.5) * 2.1;
      out += '<path d="M' + bx.toFixed(1) + ' ' + by.toFixed(1) +
        ' L' + (bx + Math.cos(ba) * (7 + Math.random() * 9)).toFixed(1) + ' ' +
        (by + Math.sin(ba) * (7 + Math.random() * 9)).toFixed(1) + '"/>';
    }
  }
  svg.innerHTML = out;
}

function buildTentacles(){
  const svg = document.getElementById('tentSvg');
  if(!svg || svg.dataset.done) return;
  svg.dataset.done = '1';
  // x 根部位置 / h 高度 / w 根部半宽 / curl 尖端偏移 / c 颜色
  const arms = [
    {x:6,  h:40, w:7.5, curl: 7,  c:'#1B3947'},
    {x:26, h:54, w:9,   curl:-9,  c:'#24495A'},
    {x:46, h:60, w:10,  curl: 6,  c:'#1A3542'},
    {x:68, h:52, w:8.5, curl:-8,  c:'#24495A'},
    {x:90, h:38, w:7,   curl:-6,  c:'#1B3947'}
  ];
  let out = '';
  for(const a of arms){
    const tipX = a.x + a.curl, tipY = 62 - a.h;
    const tipW = 1.4;
    const c1x = a.x + a.curl * 0.18 - a.w * 0.35, c1y = 62 - a.h * 0.62;
    const c2x = tipX - a.curl * 0.15,             c2y = 62 - a.h * 0.9;
    const d =
      'M' + (a.x - a.w) + ' 63 ' +
      'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + (tipX - tipW).toFixed(1) + ' ' + tipY.toFixed(1) + ' ' +
      'Q' + tipX.toFixed(1) + ' ' + (tipY - 2.2).toFixed(1) + ' ' + (tipX + tipW).toFixed(1) + ' ' + tipY.toFixed(1) + ' ' +
      'C' + (c2x + a.w * 0.55).toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + (c1x + a.w * 1.55).toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + (a.x + a.w) + ' 63 Z';
    out += '<path d="' + d + '" fill="' + a.c + '" stroke="rgba(150,215,235,.16)" stroke-width="0.7"/>';
    // 吸盘：沿中轴插值
    for(let k = 1; k <= 6; k++){
      const t = k / 7;
      const mt = 1 - t;
      const sx = mt*mt*(a.x) + 2*mt*t*(a.x + a.curl*0.25) + t*t*tipX;
      const sy = mt*mt*61 + 2*mt*t*(62 - a.h*0.6) + t*t*tipY;
      out += '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + (2.4 - t*1.5).toFixed(2) +
        '" fill="#8FC4D6" opacity="' + (0.62 - t*0.42).toFixed(2) + '"/>';
    }
  }
  svg.innerHTML = out;
}

function diveLine(levelId, n){
  const depth = 12 + levelId * 15;
  if(levelId === 60) return '下潜 ' + depth + 'm · 声呐异常 · 有东西在跟着我们';
  if(levelId === 30 || levelId === 45 || levelId === 55) return '下潜 ' + depth + 'm · 侦测到大型目标 · 保持距离';
  if(levelId % 10 === 0) return '下潜 ' + depth + 'm · 段位考核 · 目标 ' + n + ' 尾';
  if(levelId <= 3) return '下潜 ' + depth + 'm · 能见度良好 · 首次接触鱼群';
  return '下潜 ' + depth + 'm · 目标回收 ' + n + ' 尾海洋生物 · 舱压正常';

function sayBubble(c, text, ms, mad){
  if(!c.el || c.state !== 'board') return;
  const old = c.el.querySelector('.bubble');

  const b = document.createElement('div');
  b.className = 'bubble' + (mad ? ' mad' : '');

  if(location.search.indexOf('dbg') >= 0) document.title = 'BUBBLE: ' + text;

function cardIdleTick(){
  if(!S || S.status !== 'playing') return;
  let showing = 0;
  const cands = [];
  for(const c of S.cards){
    if(c.state !== 'board' || !c.el) continue;
    if(c.el.querySelector('.bubble')){ showing++; continue; }
    const free = S.clickable.has(c.id);
    c.wait = (c.wait || 0) + 1;
    const need = free ? 11 : 19;
    if(c.wait >= need){ cands.push({ c, free }); c.wait = -5; }
  }
  if(showing >= 2 || !cands.length) return;
  const pickOne = cands[Math.floor(Math.random() * cands.length)];
  const c = pickOne.c;
  const free = pickOne.free;
  if(!S.abyss && free && Math.random() < 0.22){
    sayBubble(c, '我要自爆了！！', 1600, true);
    c.el.classList.add('shake');
    setTimeout(()=>{ if(c.el) c.el.classList.remove('shake'); }, 320);
  } else {
    const arr = S.abyss ? (free ? NAG_ABYSS : NAG_UNDER) : (free ? NAG_TOP : NAG_UNDER);
    sayBubble(c, arr[Math.floor(Math.random() * arr.length)], 2800 + Math.random() * 900, !free && !S.abyss);
  }
}

  });
  html += '</div><div class="agrid">';

/* ============================ 轻量联网（原型：模拟数据） ============================ */
const Net = (function(){
  const PROV = ['广东','江苏','浙江','山东','河南','四川','湖北','湖南','福建','安徽','上海','北京','河北','陕西','辽宁','江西'];
  const FRIENDS = ['阿海','小鱼干','泡泡','阿螺','海带丝','小海豹','蟹老板','珊瑚'];
  let seed = 20261111;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  const provs = PROV.map(p=>({
    p, rate: 0.8 + rnd()*3.6, players: Math.floor(2000 + rnd()*40000), me: p === '广东'
  })).sort((a,b)=>a.rate - b.rate);
  const friends = FRIENDS.map((n, i)=>({
    n, lv: 8 + Math.floor(rnd()*52), mood: ['清澈的愚蠢','精神状态良好','汗流浃背','草台班子'][i % 4]
  })).sort((a,b)=>b.lv - a.lv);
  return {
    mock: true, provinces: provs, friends,
    feed(){
      const lv = 2 + Math.floor(rnd()*56);
      const n = 300 + Math.floor(rnd()*9000);
      const list = [
        '今日第 ' + lv + ' 关有 ' + n + ' 人差一张牌，破防退游',
        '第 ' + lv + ' 关「' + (LV[lv-1] ? LV[lv-1][0] : '') + '」已被 ' + (n*2) + ' 人挑战',
        '广东省今日通关率 ' + (1 + rnd()*4).toFixed(1) + '%，这届网友不行啊',
        '刚刚有 ' + (n % 900 + 60) + ' 人用「退！退！退！」逃过一劫',
        '第 30 关「天命打工人」今日阵亡 ' + (n % 7000 + 800) + ' 人'
      ];
      return list[Math.floor(rnd()*list.length)];
    }
  };
})();

let feedIdx = 0, feedTimer = null;
function startFeed(){
  const el = $('#feed');
  if(!el) return;
  if(feedTimer) clearInterval(feedTimer);

    if(el.classList.contains('sos')) return;

  }, 6000);
}

/* ============================ 特效引擎 ============================ */
const FX = (function(){
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, parts = [], raf = 0;
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy;
      p.rot += p.vr; p.life--;
      const a = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.globalAlpha = a * (p.alpha || 1);
      ctx.translate(p.x, p.y);
      if(p.kind === 'shard'){
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        const w = p.s, h = p.s * 0.62;
        ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 3); ctx.fill();
      } else if(p.kind === 'star'){
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for(let k = 0; k < 5; k++){
          const a1 = (k * 72 - 90) * Math.PI / 180, a2 = a1 + 36 * Math.PI / 180;
          ctx.lineTo(Math.cos(a1) * p.s, Math.sin(a1) * p.s);
          ctx.lineTo(Math.cos(a2) * p.s * 0.44, Math.sin(a2) * p.s * 0.44);
        }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = a * 0.28; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-p.s * 0.3, -p.s * 0.3, p.s * 0.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      if(p.life <= 0) parts.splice(i, 1);
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function add(p){ parts.push(p); if(parts.length > 300) parts.splice(0, parts.length - 300); if(!raf) raf = requestAnimationFrame(tick); }

  return {
    burst(x, y, color, n, power){
      n = n || 12; power = power || 1;
      for(let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 6) * power;
        add({ kind: Math.random() < 0.62 ? 'shard' : 'star',
              x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.4 * power,
              g: 0.34, s: 4 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * .5,
              life: 34 + Math.random() * 22, max: 56, color });
      }
    },
    bubbles(x, y, n){
      n = n || 7;
      for(let i = 0; i < n; i++){
        add({ kind: 'bubble', x: x + (Math.random() - .5) * 46, y: y + (Math.random() - .5) * 30,
              vx: (Math.random() - .5) * 1.3, vy: -1.2 - Math.random() * 2.2, g: -0.012,
              s: 4 + Math.random() * 8, rot: 0, vr: 0,
              life: 40 + Math.random() * 26, max: 66, color: 'rgba(255,255,255,.95)', alpha: .95 });
      }
    },
    big(x, y, color){
      this.burst(x, y, color, 26, 1.7);
      this.bubbles(x, y, 12);
    }
  };
})();

/* 启动（带自检：异常会写进标题，方便定位） */
window.addEventListener('error', function(e){ document.title = 'ERR ' + e.message + ' @' + e.lineno; });
const DBG = new URLSearchParams(location.search).get('lv');
const AUTOPLAY = location.search.indexOf('autoplay') >= 0;
const HUB = location.search.indexOf('hub') >= 0;
if(HUB){ const mapBtn = document.getElementById('btnLevels'); if(mapBtn) mapBtn.style.display = 'none'; }

/* 与合集大厅通讯：把存档变化、胜负结果告诉父页面 */
/* 父页面改画质：只切 dataset，不重开一局，进度和牌阵都不动 */
window.addEventListener('message', function(e){
  const d = e.data || {};
  if(d.source === 'hub' && d.type === 'quality'){
    document.documentElement.dataset.q = d.low ? 'low' : 'high';
  }
});

function hubNotify(type, payload){
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(Object.assign({ source:'match3', type:type }, payload || {}), '*');
    }
  }catch(e){}
}
try{
  if(DBG){ newGame(Math.max(1, Math.min(60, +DBG))); }
  if(location.search.indexOf('selftest') >= 0){
    setTimeout(function(){
      const blocked = S.cards.filter(c=>c.state==='board' && !S.clickable.has(c.id));
      if(!blocked.length){ document.title = '自检: 没有可测的被压牌'; return; }
      const target = blocked[0];
      const before = S.slot.length;
      target.el.click();
      const blockedAdded = S.slot.length - before;
      // 角落穿透：任意卡片四角若命中了更低层卡片，说明点击会漏到背后
      let cornerBug = 0, testedPts = 0;
      for (const c of S.cards) {
        if (c.state !== 'board' || !c.el) continue;
        const rr = c.el.getBoundingClientRect();
        const pts = [[rr.left+3, rr.top+3], [rr.right-3, rr.top+3], [rr.left+3, rr.bottom-3], [rr.right-3, rr.bottom-3]];
        for (const pt of pts) {
          testedPts++;
          const e2 = document.elementFromPoint(pt[0], pt[1]);
          const cc = e2 && e2.closest ? e2.closest('.card') : null;
          if (cc && +cc.dataset.id !== c.id) {
            const oc = S.byId[+cc.dataset.id];
            if (oc && oc.layer < c.layer) cornerBug++;
          }
        }
      }
      // 再测：被压牌中心点，浏览器命中到的最上层元素是谁
      const r = target.el.getBoundingClientRect();
      const hit = document.elementFromPoint(r.left + r.width/2, r.top + r.height/2);
      const hitCard = hit && hit.closest ? hit.closest('.card') : null;
      const hitIsSelf = hitCard && +hitCard.dataset.id === target.id;
      // 连点测试：点一张可点牌后，立刻在同一坐标再点一次（应被输入锁挡住）
      let dblTxt = '无';
      const freeCard = S.cards.filter(c=>c.state==='board' && S.clickable.has(c.id))[0];
      if (freeCard) {
        const r0 = freeCard.el.getBoundingClientRect();
        const cx0 = r0.left + r0.width/2, cy0 = r0.top + r0.height/2;
        const s0 = S.slot.length;
        freeCard.el.click();
        const hit2 = document.elementFromPoint(cx0, cy0);
        const c2 = hit2 && hit2.closest ? hit2.closest('.card') : null;
        if (c2) c2.click();
        dblTxt = (S.slot.length - s0) + '张';
      }
      setTimeout(function(){
        document.title = '自检 被压牌新增' + blockedAdded + '张' +
          ' 角落穿透' + cornerBug + '/' + testedPts +
          ' 连点新增' + dblTxt;
      }, 160);
    }, 400);
  }
  if(HUB && !DBG){ newGame(Math.min(progress.max || 1, 60)); }
  if(HUB){
    const bl = document.getElementById('btnLevels');
    if(bl){ bl.textContent = '‹ 地图'; bl.title = '返回海域地图'; }
    hubNotify('ready', {});
  }
  if(!DBG && !HUB){ newGame(Math.min(progress.max, 60)); showStart(); }
  if(location.search.indexOf('test=lose') >= 0){
    setTimeout(function(){ if(S && S.status === 'playing') lose(false); }, 900);
  }
  if(AUTOPLAY){
    setInterval(function(){
      if(!S || S.status !== 'playing' || !S.clickable.size) return;
      const counts = {};
      S.slot.forEach(c=>{ if(c.type !== 'W') counts[c.type] = (counts[c.type]||0)+1; });
      let id = null;
      for(const cid of S.clickable){ if(counts[S.byId[cid].type]){ id = cid; break; } }
      if(id == null) id = Array.from(S.clickable)[Math.floor(Math.random()*S.clickable.size)];
      const el = S.byId[id] && S.byId[id].el;
      if(el) el.click();
    }, 620);
  }
}catch(err){
  document.title = 'ERR ' + err.message;
}
})();
