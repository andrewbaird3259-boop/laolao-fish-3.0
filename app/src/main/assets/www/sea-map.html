<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fae"><title>海域地图 · 捞捞小鱼3.0</title>
<style>
:root{--ink:#17475b;--deep:#075274;--gold:#ffd36f;--white:#f7ffff;--glass:rgba(7,91,125,.72)}*{box-sizing:border-box}html{scroll-behavior:smooth;background:#087fae}body{margin:0;color:var(--white);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,rgba(0,116,165,.18),rgba(0,49,79,.5)),url('assets/backgrounds/map-world.png') center top/100% auto fixed,#087fae;min-height:100vh}.top{position:sticky;top:0;z-index:20;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:linear-gradient(180deg,rgba(3,69,103,.95),rgba(3,82,116,.78));backdrop-filter:blur(14px);border-bottom:1px solid #d7ffff55}.topinner{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid #e4ffff88;border-radius:15px;background:#ffffff25;color:white;font-size:23px;cursor:pointer}.heading{flex:1;min-width:0}.heading b{display:block;font-size:20px}.heading small{font-size:11px;color:#d1f5fa}.progress{min-width:100px;text-align:right;font-size:12px;font-weight:900}.bar{height:7px;margin-top:5px;border-radius:9px;background:#003d5d;overflow:hidden}.bar i{display:block;width:1.67%;height:100%;background:linear-gradient(90deg,#fff1a4,#ffb83e)}.intro{max-width:900px;margin:18px auto 12px;padding:0 16px}.introbox{padding:16px 18px;border:1px solid #e6ffff9c;border-radius:23px;background:linear-gradient(130deg,rgba(12,131,166,.76),rgba(3,72,111,.72));box-shadow:0 12px 25px #00364d55,inset 0 1px 0 #fff8;backdrop-filter:blur(10px)}.intro h1{margin:0;font-size:25px;text-shadow:0 3px 8px #003d60}.intro p{margin:5px 0 0;font-size:12px;color:#e0faff}.chapters{max-width:900px;margin:0 auto;padding:0 16px 55px;display:grid;gap:16px}.chapter{position:relative;overflow:hidden;padding:15px 14px 17px;border:1px solid #e8ffff99;border-radius:25px;background:linear-gradient(145deg,rgba(9,111,145,.74),rgba(5,59,94,.78));box-shadow:0 12px 28px #00344e55,inset 0 1px 0 #fff8;backdrop-filter:blur(8px)}.chapter:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 85% 0%,var(--glow),transparent 50%)}.chhead{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:12px}.chicon{width:54px;height:54px;display:grid;place-items:center;flex:none;border:2px solid #fff9;border-radius:18px;background:linear-gradient(145deg,var(--accent),#ffffff33);box-shadow:0 5px 12px #003d5a66;font-size:28px}.chtext{flex:1;min-width:0}.chtext h2{margin:0;font-size:17px}.chtext p{margin:3px 0 0;color:#d9f7fb;font-size:11px}.chstatus{font-size:10px;font-weight:900;color:#fff2bd;text-align:right}.nodes{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 7px;padding:7px 0 2px}.nodes:before{content:"";position:absolute;left:8%;right:8%;top:50%;height:3px;border-radius:4px;background:repeating-linear-gradient(90deg,#eaffd9bb 0 8px,transparent 8px 15px);opacity:.45}.node{position:relative;z-index:1;justify-self:center;width:min(100%,62px);aspect-ratio:1;border:2px solid #fff;border-radius:21px;background:linear-gradient(160deg,#fff2b0,#ffb63e);box-shadow:0 5px 0 #b9752c,0 8px 12px #003d5b66;color:#70400f;font-weight:1000;font-size:15px;cursor:pointer;transition:transform .15s,filter .15s}.node:active{transform:translateY(3px);box-shadow:0 2px 0 #b9752c}.node.done{background:linear-gradient(160deg,#baffdc,#38c994);box-shadow:0 5px 0 #17845f,0 8px 12px #003d5b66;color:#07583f}.node.lock{border-color:#b9d9e1;background:linear-gradient(160deg,#a8c4d1,#688ba2);box-shadow:0 5px 0 #426b85,0 8px 12px #003d5b66;color:#eafaff;cursor:not-allowed}.node .star{position:absolute;left:0;right:0;bottom:-14px;font-size:9px;letter-spacing:1px;color:#fff2a9;text-shadow:0 1px 4px #003d5b}.node .lockico{position:absolute;right:-5px;top:-7px;font-size:13px}.chfoot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:10px;border-top:1px solid #e5ffff30;color:#d7f5fa;font-size:10px}.chfoot b{color:#fff0b3}.modal{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:20px;background:#002d48aa;backdrop-filter:blur(7px)}.modal.show{display:flex}.dialog{width:min(390px,100%);padding:22px;border:2px solid #e8ffff;border-radius:27px;background:linear-gradient(155deg,#40cddd,#0873a7 80%);box-shadow:0 20px 50px #002c46aa;text-align:center}.levelbig{width:70px;height:70px;margin:0 auto 12px;display:grid;place-items:center;border:3px solid #fff;border-radius:23px;background:linear-gradient(#fff1a7,#ffbd4c);box-shadow:0 5px 0 #b8762d;color:#70400f;font-size:27px;font-weight:1000}.dialog h2{margin:0 0 6px}.dialog p{font-size:13px;line-height:1.7;color:#e4fbff}.actions{display:flex;gap:9px;justify-content:center}.actions button{border:0;border-radius:99px;padding:11px 18px;background:#ffffff25;color:white;font-weight:900;cursor:pointer}.actions .primary{background:linear-gradient(#fff0a6,#ffc65a);color:#70400f;box-shadow:0 3px 0 #b87831}.legend{max-width:900px;margin:0 auto 15px;padding:0 16px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;color:#e7fbff;font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:11px;height:11px;border:1px solid white;border-radius:4px}.dot.gold{background:#ffd36f}.dot.green{background:#55d8a0}.dot.gray{background:#7899ac}@media(min-width:700px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.nodes{gap:12px 8px}.node{width:min(100%,68px)}}@media(max-width:370px){.nodes{gap:10px 4px}.node{width:48px;border-radius:16px;font-size:13px}.chicon{width:47px;height:47px}.chtext h2{font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style></head>
<body>
<header class="top"><div class="topinner"><button class="back" id="back" aria-label="返回首页">‹</button><div class="heading"><b>海域地图</b><small>沿着海流，寻找新的伙伴</small></div><div class="progress"><span id="progressText">0 / 60 关</span><div class="bar"><i id="progressBar"></i></div></div></div></header>
<section class="intro"><div class="introbox"><h1>🐠 深海探险路线</h1><p>六大海域 · 60个挑战 · 每一次前进都有新的发现</p></div></section>
<div class="legend"><span><i class="dot gold"></i>当前可挑战</span><span><i class="dot green"></i>已完成</span><span><i class="dot gray"></i>尚未解锁</span></div>
<main class="chapters" id="chapters"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="levelbig" id="levelBig">01</div><h2 id="dialogTitle">第 1 关</h2><p id="dialogText">准备好开始挑战了吗？</p><div class="actions"><button id="cancel">再看看</button><button class="primary" id="enter">选择关卡</button></div></div></div>
<script>
// 六大海域名称、关卡区间与原版 game.html 的章节定义保持一致。
const zones=[
 {name:'阳光珊瑚海',range:'01—10',desc:'薄荷青海水与温暖阳光，开启第一次冒险',icon:'🪸',accent:'#ffc978',glow:'rgba(255,222,145,.25)'},
 {name:'荧光水母湾',range:'11—20',desc:'柔紫色荧光水母，海流开始变幻',icon:'🪼',accent:'#b8a8ff',glow:'rgba(187,160,255,.3)'},
 {name:'幽灵沉船区',range:'21—30',desc:'沉木与铜绿之间，寻找古老宝藏',icon:'⚓',accent:'#d5b27c',glow:'rgba(223,181,120,.25)'},
 {name:'远古海底遗迹',range:'31—40',desc:'石柱、古纹与神秘光束，挑战升级',icon:'🏛️',accent:'#a6d9bc',glow:'rgba(167,226,196,.25)'},
 {name:'极寒深海',range:'41—50',desc:'冰晶与寒流交织，保持探索节奏',icon:'❄️',accent:'#a9e5ff',glow:'rgba(151,220,255,.28)'},
 {name:'黑暗深渊',range:'51—60',desc:'深入未知深渊，迎接章节最终挑战',icon:'🌌',accent:'#b5a3ef',glow:'rgba(172,146,255,.28)'}
];
let save={};try{save=JSON.parse(localStorage.getItem('llaolao.fish.v1')||'{}')||{}}catch(e){};
const unlocked=Math.max(1,Math.min(60,Number(save.max)||1));const stars=save.stars||{};const completed=Object.keys(stars).filter(k=>Number(stars[k])>0).length;
document.getElementById('progressText').textContent=completed+' / 60 关';document.getElementById('progressBar').style.width=(completed/60*100)+'%';
const host=document.getElementById('chapters');let selected=1;
zones.forEach((zone,zi)=>{const start=zi*10+1;const section=document.createElement('section');section.className='chapter';section.style.setProperty('--accent',zone.accent);section.style.setProperty('--glow',zone.glow);let nodes='';for(let lv=start;lv<start+10;lv++){const isOpen=lv<=unlocked;const star=Math.max(0,Math.min(3,Number(stars[lv])||0));const isDone=star>0;nodes+=`<button class="node ${isDone?'done':isOpen?'':'lock'}" data-level="${lv}" ${isOpen?'':'disabled'} aria-label="第${lv}关${isOpen?'可挑战':'未解锁'}">${String(lv).padStart(2,'0')}${isOpen?'': '<span class="lockico">🔒</span>'}${isDone?`<span class="star">${'★'.repeat(star)}${'☆'.repeat(3-star)}</span>`:''}</button>`}section.innerHTML=`<div class="chhead"><div class="chicon">${zone.icon}</div><div class="chtext"><h2>${zone.name}</h2><p>${zone.desc}</p></div><div class="chstatus">${zone.range}<br>${unlocked>=start+9?'已开放':unlocked>=start?'探索中':'未解锁'}</div></div><div class="nodes">${nodes}</div><div class="chfoot"><span>章节 ${zi+1} · 共 10 关</span><b>${Math.max(0,Math.min(10,unlocked-start+1))}/10 已开放</b></div>`;host.appendChild(section)});
document.getElementById('back').addEventListener('click',()=>location.href='index.html');
const modal=document.getElementById('modal');function showLevel(level){selected=level;document.getElementById('levelBig').textContent=String(level).padStart(2,'0');document.getElementById('dialogTitle').textContent='第 '+level+' 关';document.getElementById('dialogText').textContent='准备好进入 '+zones[Math.floor((level-1)/10)].name+' 了吗？完成消除挑战，救出海洋伙伴！';modal.classList.add('show')}
host.addEventListener('click',e=>{const btn=e.target.closest('[data-level]');if(btn&&!btn.disabled)showLevel(Number(btn.dataset.level))});document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('enter').onclick=()=>{modal.classList.remove('show');location.href='gameplay.html?lv='+selected+'&hub=1'};modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});document.getElementById('back').onclick=()=>location.href='index.html';
</script></body></html>
