<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087fae"><title>海洋补给站 · 捞捞小鱼3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae45,#032d4bdc),url("assets/backgrounds/home-reef.png") center/cover fixed}button{font:inherit}.top{position:sticky;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#064b6def;border-bottom:1px solid #dffcff88;backdrop-filter:blur(14px)}.topin{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid #dffcff88;border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.head{flex:1}.head b{font-size:20px}.head small{display:block;font-size:11px;color:#d4f6fa}.wallet{font-size:11px;color:#fff0b5;font-weight:950;text-align:right}main{max-width:900px;margin:auto;padding:18px 15px 40px}.hero,.panel{padding:18px;border:1px solid #dffcff88;border-radius:23px;background:linear-gradient(135deg,#0b91b8d9,#06466fe8);box-shadow:0 12px 28px #00314b66}.hero h1{margin:0;font-size:24px}.hero p{margin:6px 0 0;color:#d9f8fb;font-size:12px}.items{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}.item{display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border:1px solid #e5ffff88;border-radius:20px;background:linear-gradient(145deg,#087da5e8,#064a70f2);box-shadow:0 9px 20px #00314b55}.icon{width:58px;height:58px;display:grid;place-items:center;border:1px solid #fff9;border-radius:18px;background:#ffffff22;font-size:30px}.info b{font-size:14px}.info p{margin:4px 0;color:#d4f6fa;font-size:10px;line-height:1.5}.owned{color:#c8ffdd;font-size:10px;font-weight:900}.buy{border:0;border-radius:99px;padding:9px 13px;background:linear-gradient(#fff1aa,#ffc354);color:#71450e;font-size:11px;font-weight:1000;white-space:nowrap}.buy:disabled{background:#8aaeb7;color:#e9fbff}.panel{margin-top:14px;padding:15px}.panel h2{margin:0 0 8px;font-size:16px}.panel p{margin:0;color:#d8f7fa;font-size:11px;line-height:1.7}.foot{margin:13px 4px;color:#d9f7fb;font-size:10px;line-height:1.7}@media(min-width:650px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="top"><div class="topin"><button class="back" id="back">‹</button><div class="head"><b>海洋补给站</b><small>为下一次探险准备一点小帮手</small></div><div class="wallet" id="wallet">🪙 0</div></div></header><main><section class="hero"><h1>🧰 探险补给站</h1><p>购买的道具会在下一关开始时自动带入。请按需购买，重复购买不会丢失。</p></section><section class="items" id="items"></section><section class="panel"><h2>📦 已购买的补给</h2><p id="pending">正在读取补给库存…</p></section><p class="foot">补给消耗金币，购买后存入本地存档的 pendingProps。进入下一关时，原版游戏会自动将其加入本关道具数量。</p></main>
<script>
const KEY='llaolao.fish.v1',$=s=>document.querySelector(s);
const goods=[
{id:'undo',icon:'↶',name:'时光回溯包',desc:'下一关额外获得2次撤回机会。',cost:120,qty:2},
{id:'shuffle',icon:'🔀',name:'海流洗牌包',desc:'下一关额外获得2次洗牌机会。',cost:120,qty:2},
{id:'grab',icon:'🧲',name:'磁力捞鱼包',desc:'下一关额外获得2次捞回机会。',cost:160,qty:2}
];
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function write(d){try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){alert('存档空间不足，暂时无法保存');return false}}
function render(){const d=read(),p=d.pendingProps||{};$('#wallet').textContent='🪙 '+(d.coins||0).toLocaleString('zh-CN');$('#pending').textContent='撤回 '+(p.undo||0)+' 次 · 洗牌 '+(p.shuffle||0)+' 次 · 捞回 '+(p.grab||0)+' 次';$('#items').innerHTML=goods.map(g=>`<article class="item"><div class="icon">${g.icon}</div><div class="info"><b>${g.name}</b><p>${g.desc}<br>数量：+${g.qty} · 价格：${g.cost} 金币</p></div><button class="buy" data-buy="${g.id}" ${Number(d.coins||0)<g.cost?'disabled':''}>购买</button></article>`).join('')}
$('#items').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(!b)return;const g=goods.find(x=>x.id===b.dataset.buy);if(!g)return;const d=read();if((d.coins||0)<g.cost)return;d.coins-=g.cost;d.pendingProps=d.pendingProps||{undo:0,shuffle:0,grab:0};d.pendingProps[g.id]=(d.pendingProps[g.id]||0)+g.qty;if(write(d))render()});$('#back').onclick=()=>location.href='index.html';window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
</script></body></html>
