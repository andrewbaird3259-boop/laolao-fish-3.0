<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fae"><title>我的水族馆 · 捞捞小鱼3.0</title>
<style>
:root{--deep:#06435f;--gold:#ffd36f;--stroke:#d9fbff88}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f5fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae35,#032d4bd9),url("assets/backgrounds/home-reef.png") center/cover fixed}
button{font:inherit}.top{position:sticky;top:0;z-index:10;background:#064b6def;border-bottom:1px solid #d9fbff66;backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 16px 12px}.topin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid var(--stroke);border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.title{flex:1}.title b{font-size:20px}.title small{display:block;color:#c9f4fa;font-size:11px}.wallet{font-size:12px;font-weight:950;color:#fff1b7}
main{max-width:1100px;margin:auto;padding:18px 16px 40px}.intro{padding:17px 19px;border:1px solid var(--stroke);border-radius:24px;background:linear-gradient(130deg,#0a91b7cc,#06466fdb);box-shadow:0 12px 30px #00314b66,inset 0 1px 0 #fff8}.intro h1{margin:0;font-size:25px}.intro p{margin:5px 0 0;font-size:12px;color:#d6f8fb}
.tank{position:relative;min-height:290px;margin:16px 0 14px;overflow:hidden;border:3px solid #d8ffff;border-radius:28px;background:linear-gradient(180deg,#7be9f0a8,#0b9bb7a8 55%,#08719a);box-shadow:0 14px 28px #00314c77,inset 0 0 28px #e4ffff99}.tank:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,#fff9,transparent 42%),linear-gradient(180deg,transparent 70%,#f1d18caa 71%,#b78b5b99 100%);pointer-events:none}.tank:after{content:"";position:absolute;left:-5%;right:-5%;bottom:20px;height:28px;border-radius:50%;background:#f0d39c99;filter:blur(12px)}.tank-title{position:absolute;z-index:3;left:15px;top:13px;padding:6px 11px;border:1px solid #fff9;border-radius:99px;background:#075b78a8;font-size:11px;font-weight:900}.sunbeam{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 180deg at 50% -10%,transparent 0deg 14deg,#ffffff1b 15deg 17deg,transparent 18deg 30deg);filter:blur(8px)}
.fish{position:absolute;z-index:2;width:clamp(66px,13vw,112px);height:85px;object-fit:contain;filter:drop-shadow(0 8px 5px #00445b55);animation:swim var(--dur,6s) ease-in-out infinite alternate;left:var(--x);top:var(--y)}@keyframes swim{0%{transform:translate3d(-7px,4px,0) rotate(-5deg)}100%{transform:translate3d(12px,-10px,0) rotate(5deg)}}
.decor{position:absolute;z-index:1;bottom:14px;font-size:42px;filter:drop-shadow(0 5px 3px #00516a55)}.empty{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;text-align:center;color:#eaffff;text-shadow:0 2px 6px #00516c;font-weight:900}.empty small{display:block;margin-top:6px;font-size:11px;font-weight:600}
.panel{padding:16px;border:1px solid var(--stroke);border-radius:23px;background:linear-gradient(145deg,#087da5d9,#064a70e8);box-shadow:0 10px 24px #00314b55}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.panelhead h2{margin:0;font-size:17px}.panelhead small{color:#d6f8fb;font-size:11px}.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.pet{min-width:0;padding:8px 5px;border:1px solid #e6ffff88;border-radius:17px;background:linear-gradient(145deg,#dffcff,#a6e4ee);color:#17495b;text-align:center;cursor:pointer}.pet img{width:100%;height:65px;object-fit:contain;filter:drop-shadow(0 5px 4px #17536b44)}.pet b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pet small{display:block;margin-top:3px;font-size:9px;color:#557987}.pet.active{outline:3px solid #ffdb76;box-shadow:0 0 0 5px #ffdb7633}.pet:disabled{opacity:.42;cursor:not-allowed}
.decor-row{display:flex;gap:9px;flex-wrap:wrap}.decor-btn{flex:1;min-width:90px;border:1px solid #e6ffff88;border-radius:15px;padding:10px 8px;background:#ffffff20;color:#f2ffff;font-weight:850;font-size:12px}.decor-btn.active{background:linear-gradient(#fff0a7,#ffc65a);color:#70420f;border-color:#fff3c6}.actions{display:flex;gap:9px;margin-top:13px}.action{flex:1;border:0;border-radius:99px;padding:12px 14px;background:linear-gradient(#fff0a7,#ffc65a);color:#70420f;font-weight:1000}.action.secondary{background:#ffffff25;border:1px solid #e6ffff88;color:#f5ffff}
.note{margin:12px 3px 0;color:#e0faff;font-size:10px;line-height:1.6}
@media(min-width:720px){.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px;align-items:start}.tank{min-height:430px}.roster{grid-template-columns:repeat(3,minmax(0,1fr))}.pet img{height:75px}}
@media(max-width:370px){.roster{gap:6px}.pet{padding:6px 3px}.pet img{height:54px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top"><div class="topin"><button class="back" id="back" aria-label="返回">‹</button><div class="title"><b>我的水族馆</b><small>把遇见的伙伴，带回温暖的家</small></div><div class="wallet" id="count">0 条伙伴</div></div></header>
<main>
<section class="intro"><h1>🏝️ 专属海底家园</h1><p>选择已经发现的伙伴入住鱼缸，也可以布置你喜欢的海底装饰。</p></section>
<div class="layout">
<section>
<div class="tank" id="tank"><div class="sunbeam"></div><span class="tank-title">我的珊瑚湾 · 水族馆</span><div class="empty" id="empty">水族馆正在等待第一位伙伴<small>完成消除关卡，在海洋图鉴中发现小鱼</small></div><span class="decor" data-decor="coral" style="left:7%">🪸</span><span class="decor" data-decor="seaweed" style="right:8%">🌿</span><span class="decor" data-decor="shell" style="left:47%">🐚</span></div>
<section class="panel"><div class="panelhead"><h2>海底装饰</h2><small>点击布置 / 收起</small></div><div class="decor-row"><button class="decor-btn" data-decor-toggle="coral">🪸 珊瑚花园</button><button class="decor-btn" data-decor-toggle="seaweed">🌿 海草丛</button><button class="decor-btn" data-decor-toggle="shell">🐚 珍珠贝壳</button></div><p class="note">装饰目前为免费布置原型，不消耗金币；后续再接入装饰商店与摆放编辑器。</p></section>
</section>
<section class="panel"><div class="panelhead"><h2>我的伙伴</h2><small id="rosterCount">已发现 0 种</small></div><div class="roster" id="roster"></div><div class="actions"><button class="action" id="dex">去海洋图鉴</button><button class="action secondary" id="explore">继续探险</button></div><p class="note">最多同时展示 8 条伙伴。点选卡片即可入住或离开鱼缸；已发现的鱼类来自原版关卡图鉴进度。</p></section>
</div>
</main>
<script src="species-data.js"></script>
<script>
const KEY='llaolao.fish.v1',MAX=8,$=s=>document.querySelector(s);
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function unlockedIds(d){const set=new Set(),dex=d.dex||{};if(Array.isArray(dex))dex.forEach(x=>set.add(Number(x)));else Object.keys(dex).forEach(k=>{if(dex[k])set.add(Number(k))});(d.aqua&&Array.isArray(d.aqua.fish)?d.aqua.fish:[]).forEach(name=>{const f=SPECIES_DATA.find(x=>x.name===name);if(f)set.add(f.id)});Object.keys(d.aqua&&d.aqua.owned||{}).forEach(k=>{if(d.aqua.owned[k])set.add(Number(k))});return set}
function saveAqua(mutator){const d=read();d.aqua=d.aqua||{owned:{},fish:[],decor:[],chest:''};d.aqua.owned=d.aqua.owned||{};d.aqua.fish=Array.isArray(d.aqua.fish)?d.aqua.fish:[];d.aqua.decor=Array.isArray(d.aqua.decor)?d.aqua.decor:[];mutator(d.aqua);try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert('存档空间不足，暂时无法保存')}render()}
function render(){const d=read(),got=unlockedIds(d);let selected=Array.isArray(d.aqua&&d.aqua.tankFish)?d.aqua.tankFish.map(Number).filter(id=>got.has(id)):[];selected=[...new Set(selected)].slice(0,MAX);const decor=Array.isArray(d.aqua&&d.aqua.decor)?d.aqua.decor:[];$('#count').textContent=got.size+' 条伙伴';$('#rosterCount').textContent='已发现 '+got.size+' 种';$('#empty').style.display=selected.length?'none':'block';document.querySelectorAll('.fish').forEach(x=>x.remove());selected.forEach((id,i)=>{const f=SPECIES_DATA[id];if(!f)return;const img=document.createElement('img');img.className='fish';img.alt=f.name;img.src='assets/fish/'+f.asset+'.webp';img.style.setProperty('--x',(12+(i%4)*21)+'%');img.style.setProperty('--y',(25+Math.floor(i/4)*34)+'%');img.style.setProperty('--dur',(5.2+(i%4)*.7)+'s');$('#tank').appendChild(img)});document.querySelectorAll('[data-decor]').forEach(el=>el.style.display=decor.includes(el.dataset.decor)?'block':'none');document.querySelectorAll('[data-decor-toggle]').forEach(btn=>btn.classList.toggle('active',decor.includes(btn.dataset.decorToggle)));const items=SPECIES_DATA.filter(f=>got.has(f.id));$('#roster').innerHTML=items.length?items.map(f=>{const active=selected.includes(f.id);return `<button class="pet ${active?'active':''}" data-fish="${f.id}" aria-pressed="${active}"><img loading="lazy" src="assets/fish/${f.asset}.webp" alt="${f.name}"><b>${f.name}</b><small>${active?'已入住 · 点击离开':'点击入住'}</small></button>`}).join(''):'<div style="grid-column:1/-1;text-align:center;padding:22px;color:#e2faff;font-size:12px">还没有发现伙伴。先去完成一关探险吧！</div>'}
$('#roster').addEventListener('click',e=>{const b=e.target.closest('[data-fish]');if(!b)return;const id=Number(b.dataset.fish),d=read(),got=unlockedIds(d),selected=Array.isArray(d.aqua&&d.aqua.tankFish)?d.aqua.tankFish.map(Number):[];if(!got.has(id))return;const idx=selected.indexOf(id);if(idx>=0)selected.splice(idx,1);else{if(selected.length>=MAX){alert('鱼缸最多展示8条伙伴，请先让一位伙伴休息。');return}selected.push(id)}saveAqua(a=>a.tankFish=selected)});
document.querySelectorAll('[data-decor-toggle]').forEach(b=>b.addEventListener('click',()=>saveAqua(a=>{const key=b.dataset.decorToggle;a.decor=a.decor||[];a.decor=a.decor.includes(key)?a.decor.filter(x=>x!==key):[...a.decor,key]})));
$('#back').onclick=()=>location.href='index.html';$('#dex').onclick=()=>location.href='dex.html';$('#explore').onclick=()=>{const d=read();location.href='gameplay.html?lv='+Math.max(1,Math.min(60,Number(d.max)||1))+'&hub=1'};window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
</script></body></html>
