<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087fae"><title>游戏设置 · 捞捞小鱼3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae45,#032d4bdc),url("assets/backgrounds/home-reef.png") center/cover fixed}button,input{font:inherit}.top{position:sticky;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#064b6def;border-bottom:1px solid #dffcff88;backdrop-filter:blur(14px)}.topin{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid #dffcff88;border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.head{flex:1}.head b{font-size:20px}.head small{display:block;font-size:11px;color:#d4f6fa}main{max-width:820px;margin:auto;padding:18px 15px 40px}.hero,.panel{padding:18px;border:1px solid #dffcff88;border-radius:23px;background:linear-gradient(135deg,#0b91b8d9,#06466fe8);box-shadow:0 12px 28px #00314b66}.hero h1{margin:0;font-size:23px}.hero p{margin:6px 0 0;color:#d9f8fb;font-size:12px;line-height:1.7}.panel{margin-top:14px;padding:16px}.panel h2{margin:0 0 7px;font-size:16px}.panel p{margin:0 0 12px;color:#d8f7fa;font-size:11px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{flex:1;min-width:140px;border:0;border-radius:99px;padding:12px 15px;background:linear-gradient(#fff1aa,#ffc354);color:#71450e;font-weight:1000}.btn.secondary{border:1px solid #e5ffff88;background:#ffffff20;color:#f4fdff}.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px;border:1px solid #e5ffff66;border-radius:15px;background:#ffffff18}.stat small{display:block;color:#d4f6fa;font-size:10px}.stat b{display:block;margin-top:5px;font-size:18px;color:#fff0b5;overflow-wrap:anywhere}.warning{margin-top:12px;padding:11px 12px;border:1px solid #ffdfa477;border-radius:14px;background:#7b552d55;color:#ffefc8;font-size:10px;line-height:1.7}.toast{min-height:18px;margin-top:10px;color:#d7ffdf;font-size:11px}.hidden{display:none!important}@media(min-width:600px){main{padding-top:24px}.status{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="top"><div class="topin"><button class="back" id="back" aria-label="返回">‹</button><div class="head"><b>游戏设置</b><small>管理你的海洋存档</small></div></div></header><main>
<section class="hero"><h1>⚙️ 安全管理</h1><p>《捞捞小鱼》目前使用本地存档。建议在更换手机、清理浏览器数据或安装新版本前，先导出一份备份。</p></section>
<section class="panel"><h2>📦 当前存档状态</h2><div class="status"><div class="stat"><small>最高关卡</small><b id="max">—</b></div><div class="stat"><small>金币</small><b id="coins">—</b></div><div class="stat"><small>水滴</small><b id="drops">—</b></div><div class="stat"><small>已发现伙伴</small><b id="fish">—</b></div></div><div class="actions" style="margin-top:13px"><button class="btn" id="export">导出存档备份</button><button class="btn secondary" id="importBtn">从备份恢复</button><input class="hidden" id="file" type="file" accept=".json,application/json"></div><div class="toast" id="status" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>🛡️ 恢复前请注意</h2><p>恢复备份会用所选文件替换当前本地存档。请先导出当前存档，以免覆盖之后的新进度。</p><div class="warning">备份文件只保存在你选择的位置。游戏不会自动上传云端，也不会在不同设备之间自动同步。请勿把存档文件发给陌生人。</div></section>
<section class="panel"><h2>ℹ️ 版本信息</h2><p>捞捞小鱼 3.0 · 本地单机版本<br>存档标识：llaolao.fish.v1<br>备份格式：JSON</p></section>
</main>
<script src="species-data.js"></script><script>
const KEY='llaolao.fish.v1',$=s=>document.querySelector(s);
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function fishCount(d){const ids=new Set(),dex=d.dex||{};if(Array.isArray(dex))dex.forEach(x=>ids.add(Number(x)));else Object.keys(dex).forEach(k=>{if(dex[k])ids.add(Number(k))});(d.aqua&&d.aqua.fish||[]).forEach(n=>{const f=SPECIES_DATA.find(x=>x.name===n);if(f)ids.add(f.id)});Object.keys(d.aqua&&d.aqua.owned||{}).forEach(k=>{if(d.aqua.owned[k])ids.add(Number(k))});return ids.size}
function message(t){$('#status').textContent=t}
function render(){const d=read();$('#max').textContent=Math.max(1,Number(d.max)||1);$('#coins').textContent=(Number(d.coins)||0).toLocaleString('zh-CN');$('#drops').textContent=(Number(d.drops)||0).toLocaleString('zh-CN');$('#fish').textContent=fishCount(d)+' / '+SPECIES_DATA.length}
function validSave(d){if(!d||typeof d!=='object'||Array.isArray(d))return false;const keys=['max','stars','coins','drops','medals','dex','aqua','pendingProps','xp','daily','signIn','stats'];if(!keys.some(k=>Object.prototype.hasOwnProperty.call(d,k)))return false;if(d.max!==undefined&&(!Number.isFinite(Number(d.max))||Number(d.max)<1||Number(d.max)>60))return false;if(d.coins!==undefined&&(!Number.isFinite(Number(d.coins))||Number(d.coins)<0))return false;if(d.drops!==undefined&&(!Number.isFinite(Number(d.drops))||Number(d.drops)<0))return false;if(d.stars!==undefined&&(typeof d.stars!=='object'||d.stars===null||Array.isArray(d.stars)))return false;if(d.aqua!==undefined&&(typeof d.aqua!=='object'||d.aqua===null||Array.isArray(d.aqua)))return false;return true}
$('#export').onclick=()=>{const raw=localStorage.getItem(KEY);if(!raw){message('当前没有存档可导出。');return}const d=read();const payload={app:'捞捞小鱼',version:3,exportedAt:new Date().toISOString(),save:d};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='捞捞小鱼-存档备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);message('备份已生成，请确认浏览器下载完成。')};
$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),d=parsed&&parsed.save?parsed.save:parsed;if(!validSave(d)){message('文件格式不正确，当前存档没有改变。');return}if(!confirm('确定用这份备份替换当前存档吗？建议先导出当前存档。'))return;localStorage.setItem(KEY,JSON.stringify(d));message('恢复成功，正在刷新存档状态。');render();}catch(err){message('读取失败：文件可能损坏或浏览器存储不可用。')}finally{e.target.value=''}};
$('#back').onclick=()=>location.href='index.html';render();
</script></body></html>
