<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fae"><title>每日任务 · 捞捞小鱼3.0</title>
<style>
:root{--line:#dffcff88;--gold:#ffd36f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae45,#032d4bdc),url("assets/backgrounds/home-reef.png") center/cover fixed}button{font:inherit}.top{position:sticky;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#064b6def;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.head{flex:1}.head b{font-size:20px}.head small{display:block;font-size:11px;color:#d4f6fa}.wallet{font-size:11px;font-weight:950;color:#fff0b5;text-align:right}main{max-width:900px;margin:auto;padding:17px 15px 40px}.hero{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(130deg,#0b91b8d9,#06466fe8);box-shadow:0 12px 30px #00314b66}.hero h1{margin:0;font-size:24px}.hero p{margin:5px 0 13px;font-size:12px;color:#d8f8fb}.signrow{display:flex;align-items:center;gap:12px}.streak{flex:1;font-size:12px;color:#e2fbff}.streak b{display:block;color:#fff0b5;font-size:20px}.sign{border:0;border-radius:99px;padding:12px 20px;background:linear-gradient(#fff1aa,#ffc354);color:#71450e;font-weight:1000;box-shadow:0 4px 0 #b7792f}.sign:disabled{opacity:.58;filter:grayscale(.25);box-shadow:none}.section{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#087da5dd,#064a70eb);box-shadow:0 10px 24px #00314b55}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:17px}.sectionhead small{color:#d4f6fa;font-size:10px}.task{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eaffff25}.task:first-of-type{border-top:0}.taskicon{width:40px;height:40px;display:grid;place-items:center;border:1px solid #eaffff88;border-radius:14px;background:#ffffff20;font-size:21px}.taskinfo{min-width:0}.taskinfo b{display:block;font-size:13px}.taskinfo small{display:block;margin-top:3px;color:#cceef3;font-size:10px}.bar{height:6px;margin-top:7px;border-radius:9px;background:#003b5b;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#fff1a2,#ffc14f)}.reward{min-width:78px;text-align:right;font-size:10px;color:#ffe7a3;line-height:1.6}.claim{display:block;margin:6px 0 0 auto;border:0;border-radius:99px;padding:7px 12px;background:linear-gradient(#fff1aa,#ffc354);color:#71450e;font-size:11px;font-weight:950}.claim:disabled{background:#8aaeb7;color:#e9fbff}.shoplink{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:#f4fdff}.shoplink b{font-size:14px}.shoplink small{display:block;color:#d4f6fa;font-size:10px}.shoplink span:last-child{font-size:24px}.foot{margin:14px 4px;color:#d9f7fb;font-size:10px;line-height:1.7}@media(min-width:680px){main{padding-top:24px}.hero{padding:22px}.task{padding:14px 4px}.taskicon{width:46px;height:46px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><div class="topin"><button class="back" id="back">‹</button><div class="head"><b>每日任务</b><small>每天一点点，海底家园慢慢长大</small></div><div class="wallet" id="wallet">🪙 0<br>🫧 0</div></div></header>
<main>
<section class="hero"><h1>☀️ 今日海洋委托</h1><p>完成探险目标，领取金币、水滴和经验。每日进度会在本地自动保存。</p><div class="signrow"><div class="streak"><b id="streak">连续签到 0 天</b><span id="signHint">今天的海洋补给正在等你</span></div><button class="sign" id="sign">领取签到奖励</button></div></section>
<section class="section"><div class="sectionhead"><h2>🎯 每日挑战</h2><small id="taskDate"></small></div><div id="tasks"></div></section>
<section class="section"><a class="shoplink" href="shop.html"><span><b>🧰 海洋补给站</b><small>用金币购买下一关可携带的实用道具</small></span><span>›</span></a></section>
<p class="foot">提示：每日任务按设备本地日期刷新。奖励仅保存在当前浏览器/设备的本地存档中；清除浏览器数据可能导致本地进度丢失。</p>
</main>
<script>
const KEY='llaolao.fish.v1', $=s=>document.querySelector(s);
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function write(d){try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){alert('存档空间不足，暂时无法保存');return false}}
function daily(d){const today=dayKey();if(!d.daily||d.daily.date!==today)d.daily={date:today,wins:0,stars:0,newFish:0,coinsEarned:0,claimed:{}};d.daily.claimed=d.daily.claimed||{};return d.daily}
function xpLevel(xp){let lv=1,rest=Math.max(0,Number(xp)||0);while(rest>=lv*100){rest-=lv*100;lv++}return {lv,rest,next:lv*100}}
const defs=[
{id:'win1',icon:'🐚',name:'完成一次探险',desc:'今天成功通关任意1关',field:'wins',goal:1,coins:50,drops:10,xp:15},
{id:'win3',icon:'🐠',name:'海洋巡游者',desc:'今天累计成功通关3关',field:'wins',goal:3,coins:100,drops:25,xp:30},
{id:'stars3',icon:'⭐',name:'闪亮表现',desc:'今天累计获得3颗关卡星星',field:'stars',goal:3,coins:60,drops:15,xp:20},
{id:'fish1',icon:'🪸',name:'结识新伙伴',desc:'今天首次发现至少1种新鱼',field:'newFish',goal:1,coins:100,drops:30,xp:25}
];
function render(){const d=read(),day=daily(d),sign=d.signIn||{},today=dayKey(),signed=sign.lastDate===today,lv=xpLevel(d.xp);$('#wallet').innerHTML='🪙 '+(d.coins||0).toLocaleString('zh-CN')+'<br>🫧 '+(d.drops||0).toLocaleString('zh-CN');$('#streak').textContent='连续签到 '+(sign.streak||0)+' 天';$('#signHint').textContent=signed?'今天已经领取，明天再来看看':'签到可领取金币、水滴和经验';$('#sign').disabled=signed;$('#sign').textContent=signed?'今日已签到':'领取签到奖励';$('#taskDate').textContent=today+' · Lv.'+lv.lv;$('#tasks').innerHTML=defs.map(t=>{const v=Math.min(t.goal,Number(day[t.field])||0),done=v>=t.goal,claimed=!!day.claimed[t.id];return `<article class="task"><div class="taskicon">${t.icon}</div><div class="taskinfo"><b>${t.name}</b><small>${t.desc} · ${v}/${t.goal}</small><div class="bar"><i style="width:${v/t.goal*100}%"></i></div></div><div class="reward">🪙 ${t.coins} · 🫧 ${t.drops}<button class="claim" data-claim="${t.id}" ${!done||claimed?'disabled':''}>${claimed?'已领取':done?'领取奖励':'未完成'}</button></div></article>`}).join('')}
$('#sign').onclick=()=>{const d=read(),sign=d.signIn||{},today=dayKey();if(sign.lastDate===today)return;const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const y=dayKey(yesterday);sign.streak=sign.lastDate===y?(Number(sign.streak)||0)+1:1;sign.lastDate=today;const day=daily(d);day.signedIn=true;const bonus=sign.streak%7===0?250:80,drop=sign.streak%7===0?50:10;d.coins=(d.coins||0)+bonus;d.drops=(d.drops||0)+drop;d.xp=(d.xp||0)+10+Math.min(sign.streak,7)*2;d.signIn=sign;if(write(d)){render();alert('签到成功！获得 '+bonus+' 金币、'+drop+' 水滴和经验。')}};$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-claim]');if(!b)return;const t=defs.find(x=>x.id===b.dataset.claim);if(!t)return;const d=read(),day=daily(d);if(day.claimed[t.id]||(Number(day[t.field])||0)<t.goal)return;day.claimed[t.id]=true;d.coins=(d.coins||0)+t.coins;d.drops=(d.drops||0)+t.drops;d.xp=(d.xp||0)+t.xp;if(write(d))render()});$('#back').onclick=()=>location.href='index.html';window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
</script></body></html>
