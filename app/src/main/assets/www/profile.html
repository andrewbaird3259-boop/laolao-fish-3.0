<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4fdff;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#087fae45,#032d4bdc),url("assets/backgrounds/home-reef.png") center/cover fixed}button{font:inherit}.top{position:sticky;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#064b6def;border-bottom:1px solid #dffcff88;backdrop-filter:blur(14px)}.topin{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid #dffcff88;border-radius:14px;background:#ffffff20;color:#fff;font-size:24px}.head{flex:1}.head b{font-size:20px}.head small{display:block;font-size:11px;color:#d4f6fa}main{max-width:900px;margin:auto;padding:18px 15px 40px}.hero{display:flex;align-items:center;gap:15px;padding:20px;border:1px solid #dffcff88;border-radius:24px;background:linear-gradient(130deg,#0b91b8dc,#06466fe8);box-shadow:0 12px 28px #00314b66}.avatar{width:78px;height:78px;display:grid;place-items:center;flex:none;border:3px solid #fff;border-radius:50%;background:linear-gradient(145deg,#ffe9ac,#ffad70);font-size:42px;box-shadow:0 5px 0 #b8754e}.who{flex:1;min-width:0}.who h1{margin:0;font-size:22px}.who p{margin:4px 0;color:#d8f7fb;font-size:11px}.bar{height:8px;margin-top:9px;border-radius:9px;background:#003b5b;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#fff1a2,#ffc14f)}.xptext{margin-top:5px;color:#d8f7fb;font-size:10px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.stat{padding:15px;border:1px solid #e5ffff88;border-radius:19px;background:linear-gradient(145deg,#087da5e8,#064a70f2);box-shadow:0 8px 18px #00314b55}.stat small{display:block;color:#d4f6fa;font-size:10px}.stat b{display:block;margin-top:5px;font-size:23px;color:#fff0b5}.section{margin-top:15px;padding:16px;border:1px solid #dffcff88;border-radius:22px;background:linear-gradient(145deg,#087da5dd,#064a70eb)}.section h2{margin:0 0 12px;font-size:16px}.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.badge{padding:11px;border:1px solid #e5ffff55;border-radius:15px;background:#ffffff17}.badge b{display:block;font-size:12px}.badge small{display:block;margin-top:4px;color:#d4f6fa;font-size:10px}.badge.lock{opacity:.48;filter:grayscale(.5)}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.link{border:1px solid #e5ffff66;border-radius:15px;padding:12px;background:#ffffff1b;color:#f4fdff;text-align:left;font-weight:850;font-size:12px}.link small{display:block;margin-top:4px;color:#d4f6fa;font-size:10px;font-weight:500}@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="top"><div class="topin"><button class="back" id="back">‹</button><div class="head"><b>我的海洋档案</b><small>每一次探险，都留下成长的痕迹</small></div></div></header><main><section class="hero"><div class="avatar">🐠</div><div class="who"><h1 id="level">Lv.01 海洋新朋友</h1><p id="rank">阳光珊瑚海 · 第1关</p><div class="bar"><i id="xpbar"></i></div><div class="xptext" id="xptext">0 / 100 XP</div></div></section><section class="stats"><div class="stat"><small>🪙 金币</small><b id="coins">0</b></div><div class="stat"><small>🫧 水滴</small><b id="drops">0</b></div><div class="stat"><small>🏅 累计勋章</small><b id="medals">0</b></div><div class="stat"><small>🐚 最高关卡</small><b id="max">1</b></div></section><section class="section"><h2>📊 探险记录</h2><div class="stats"><div class="stat"><small>成功通关</small><b id="wins">0</b></div><div class="stat"><small>累计星星</small><b id="stars">0</b></div><div class="stat"><small>发现伙伴</small><b id="fish">0</b></div><div class="stat"><small>累计金币收入</small><b id="earned">0</b></div></div></section><section class="section"><h2>🏆 海洋成就</h2><div class="badges" id="badges"></div></section><section class="section"><h2>🧭 快捷入口</h2><div class="links"><button class="link" data-go="tasks.html">每日任务<small>签到、挑战与奖励</small></button><button class="link" data-go="shop.html">海洋补给站<small>购买关卡道具</small></button><button class="link" data-go="dex.html">海洋图鉴<small>查看已发现伙伴</small></button><button class="link" data-go="aquarium.html">我的水族馆<small>布置专属鱼缸</small></button><button class="link" data-go="settings.html">游戏设置<small>备份和恢复存档</small></button></div></section></main>
<script src="species-data.js"></script><script>
const KEY='llaolao.fish.v1',$=s=>document.querySelector(s);function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function xpLevel(xp){let lv=1,rest=Math.max(0,Number(xp)||0);while(rest>=lv*100){rest-=lv*100;lv++}return {lv,rest,next:lv*100}}
function fishCount(d){const ids=new Set(),dex=d.dex||{};if(Array.isArray(dex))dex.forEach(x=>ids.add(Number(x)));else Object.keys(dex).forEach(k=>{if(dex[k])ids.add(Number(k))});(d.aqua&&d.aqua.fish||[]).forEach(n=>{const f=SPECIES_DATA.find(x=>x.name===n);if(f)ids.add(f.id)});Object.keys(d.aqua&&d.aqua.owned||{}).forEach(k=>{if(d.aqua.owned[k])ids.add(Number(k))});return ids.size}
function render(){const d=read(),x=xpLevel(d.xp),max=Math.max(1,Number(d.max)||1),names=['阳光珊瑚海','荧光水母湾','幽灵沉船区','远古海底遗迹','极寒深海','黑暗深渊'],s=d.stats||{},st=d.stars||{},starCount=Object.values(st).reduce((a,b)=>a+(Number(b)||0),0),fish=fishCount(d);$('#level').textContent='Lv.'+String(x.lv).padStart(2,'0')+' 海洋探险家';$('#rank').textContent=names[Math.min(5,Math.floor((max-1)/10))]+' · 第'+max+'关';$('#xpbar').style.width=x.rest/x.next*100+'%';$('#xptext').textContent=x.rest+' / '+x.next+' XP';$('#coins').textContent=(d.coins||0).toLocaleString('zh-CN');$('#drops').textContent=(d.drops||0).toLocaleString('zh-CN');$('#medals').textContent=d.medals||0;$('#max').textContent=max;$('#wins').textContent=s.totalWins||0;$('#stars').textContent=starCount;$('#fish').textContent=fish+'/'+SPECIES_DATA.length;$('#earned').textContent=(s.totalCoinsEarned||0).toLocaleString('zh-CN');const achievements=[['first','初次返航','成功通关1关',(s.totalWins||0)>=1],['ten','海洋熟客','成功通关10关',(s.totalWins||0)>=10],['star30','星光收集者','累计获得30颗星',(s.totalStars||0)>=30],['collector','鱼类收藏家','发现10种海洋伙伴',fish>=10],['explorer','海域开拓者','抵达第21关',max>=21],['master','深海守护者','抵达第60关',max>=60]];$('#badges').innerHTML=achievements.map(a=>`<div class="badge ${a[3]?'':'lock'}"><b>${a[3]?'🏅':'🔒'} ${a[1]}</b><small>${a[2]}</small></div>`).join('')}
$('#back').onclick=()=>location.href='index.html';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
</script></body></html>
